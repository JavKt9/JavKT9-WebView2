name: Compilar lanzador edicion publica (privado)

on:
  workflow_dispatch:
  push:
    branches:
      - edicion-publica-desarrollo
    paths:
      - src/public-launcher/**
      - src/public-bridge-launcher/**
      - src/public-webview2/**
      - tools/armar_portable_publica_desarrollo.py
      - tools/test_armar_portable_publica_desarrollo.py
      - .github/workflows/compilar-edicion-publica-desarrollo.yml

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout rama aislada
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar Go 1.23.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Probar codigo fuente
        working-directory: src/public-launcher
        run: go test ./...
      - name: Compilar nuevo lanzador Windows x64
        shell: pwsh
        working-directory: src/public-launcher
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Path "../../build" -Force | Out-Null
          go build -trimpath -ldflags="-H windowsgui" -o "../../build/JavKT9.exe" .
          if ($LASTEXITCODE -ne 0) { throw "Error compilando lanzador" }
          if (!(Test-Path "../../build/JavKT9.exe")) { throw "Falta ejecutable" }
          Get-FileHash "../../build/JavKT9.exe" -Algorithm SHA256
      - name: Probar y compilar nuevo BridgeLauncher Go
        shell: pwsh
        working-directory: src/public-bridge-launcher
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Error en pruebas BridgeLauncher" }
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-H windowsgui" -o "../../build/GCJavBridgeLauncher.exe" .
          if ($LASTEXITCODE -ne 0) { throw "Error compilando BridgeLauncher" }
          if (!(Test-Path "../../build/GCJavBridgeLauncher.exe")) { throw "Falta BridgeLauncher" }
          Get-FileHash "../../build/GCJavBridgeLauncher.exe" -Algorithm SHA256
      - name: Guardar solo el lanzador de desarrollo (artefacto privado)
        uses: actions/upload-artifact@v4
        with:
          name: JavKT9-Publica-Desarrollo-lanzador-win64
          path: build/*.exe
          if-no-files-found: error
          retention-days: 7

  host-webview2:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout rama aislada
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar variante publica del host WebView2
        shell: pwsh
        run: |
          dotnet restore "src/public-webview2/JavKT9WebView2.Public.csproj" -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Error restaurando dependencias" }
          dotnet publish "src/public-webview2/JavKT9WebView2.Public.csproj" -c Release -r win-x64 --self-contained true --no-restore -o "build/WebView2Host"
          if ($LASTEXITCODE -ne 0) { throw "Error compilando host publico" }
          if (!(Test-Path "build/WebView2Host/JavKT9WebView2.exe")) { throw "Falta host" }
          Get-FileHash "build/WebView2Host/JavKT9WebView2.exe" -Algorithm SHA256
      - name: Guardar host de desarrollo (artefacto privado)
        uses: actions/upload-artifact@v4
        with:
          name: JavKT9-Publica-Desarrollo-WebView2Host-win64
          path: build/WebView2Host/
          if-no-files-found: error
          retention-days: 7

  paquete-portable:
    needs: [launcher, host-webview2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rama privada
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtener lanzador Go nuevo
        uses: actions/download-artifact@v4
        with:
          name: JavKT9-Publica-Desarrollo-lanzador-win64
          path: build/launcher
      - name: Obtener host WebView2 aislado
        uses: actions/download-artifact@v4
        with:
          name: JavKT9-Publica-Desarrollo-WebView2Host-win64
          path: build/WebView2Host
      - name: Descargar RC1 original desde release privada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/623451801" \
            --output "$RUNNER_TEMP/JAVkt9_RC1.zip"
          echo "08fb8ef765e01909225245768d36be7797f4770a6a5d8eb7198d3f6195aadac4  $RUNNER_TEMP/JAVkt9_RC1.zip" | sha256sum -c -
      - name: Verificar exclusion de lanzadores antiguos y claves
        shell: bash
        run: python3 -m unittest discover -s tools -p 'test_armar_portable_publica_desarrollo.py' -v
      - name: Armar ZIP portatil de desarrollo (sin instalador)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/armar_portable_publica_desarrollo.py \
            --rc1 "$RUNNER_TEMP/JAVkt9_RC1.zip" \
            --launcher build/launcher/JavKT9.exe \
            --host build/WebView2Host \
            --repo . \
            --output build/JAVkt9_Edicion_Publica_Desarrollo_PORTABLE_PRIVADO.zip
          unzip -l build/JAVkt9_Edicion_Publica_Desarrollo_PORTABLE_PRIVADO.zip | tail -n 2
          sha256sum build/JAVkt9_Edicion_Publica_Desarrollo_PORTABLE_PRIVADO.zip
      - name: Guardar vista previa PRIVADA (no release)
        uses: actions/upload-artifact@v4
        with:
          name: JAVkt9_Edicion_Publica_Desarrollo_PORTABLE_PRIVADO
          path: build/JAVkt9_Edicion_Publica_Desarrollo_PORTABLE_PRIVADO.zip
          if-no-files-found: error
          retention-days: 7

  smoke-perl-fuente:
    needs: [paquete-portable]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout rama privada
        uses: actions/checkout@v4
      - name: Obtener paquete portable privado
        uses: actions/download-artifact@v4
        with:
          name: JAVkt9_Edicion_Publica_Desarrollo_PORTABLE_PRIVADO
          path: preview
      - name: Comprobar arranque del script Perl sin PAR (sin GUI)
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "preview/JAVkt9_Edicion_Publica_Desarrollo_PORTABLE_PRIVADO.zip" -DestinationPath "preview/unpacked" -Force
          $exe = (Resolve-Path "preview/unpacked/JAVkt9-Publica-Desarrollo/JavKT9.exe").Path
          $passed = $false
          $reason = "No se pudo completar el arranque del script Perl."
          try {
            $p = Start-Process -FilePath $exe -ArgumentList @('--source-mode', '--version') -PassThru
            if (!$p.WaitForExit(45000)) {
              $p.Kill()
              $reason = "El proceso no termino en 45 segundos."
            } elseif ($p.ExitCode -eq 0) {
              $passed = $true
            } else {
              $reason = "El proceso termino con codigo distinto de cero."
            }
          } catch {
            $reason = "No se pudo iniciar el proceso de prueba."
          }
          if ($passed) {
            $status = "**RESULTADO: CORRECTO.** El lanzador Go pudo iniciar el script Perl con `--version` sin usar el PAR."
          } else {
            $status = "**RESULTADO: NO SUPERADO.** " + $reason
          }
          $report = @"
          # Prueba de arranque desde fuentes Perl

          $status

          La prueba se ejecuto en un runner Windows aislado sobre el ZIP portatil privado. Solo solicito la version del script Perl; **no se ejecuto la interfaz grafica ni se comprobo la busqueda con WebView2**.

          El resultado no autoriza una release publica. No se modificaron las instalaciones del usuario.
          "@
          Set-Content -LiteralPath "docs/RESULTADO_MODO_PERL_FUENTE.md" -Value $report -Encoding utf8
          git add docs/RESULTADO_MODO_PERL_FUENTE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ((git diff --cached --name-only).Length -gt 0) {
            git commit -m "ci: registrar prueba de arranque Perl sin PAR"
            git pull --rebase origin edicion-publica-desarrollo
            git push origin HEAD:edicion-publica-desarrollo
          }
          if (!$passed) { throw "No paso la prueba de arranque Perl desde fuentes" }

  registrar-resultado:
    needs: [launcher, host-webview2, paquete-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout rama privada
        uses: actions/checkout@v4
      - name: Guardar estado de compilacion de los dos proyectos
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "edicion-publica-desarrollo"
          cat > docs/RESULTADO_COMPILACION_PUBLICA_DESARROLLO.md <<'EOF'
          # Compilacion de la edicion publica — rama privada

          **RESULTADO: CORRECTO EN GITHUB ACTIONS.**

          - Dos lanzadores Go 1.23.2 para Windows x64: pruebas unitarias y compilacion completadas.
          - Variante separada del host WebView2 con .NET 8 para Windows x64: compilacion completada.
          - Se genero un ZIP portatil de desarrollo privado con el nuevo lanzador Go y el host WebView2 aislado, junto a dependencias originales de RC1; retencion de 7 dias. No es una release.
          - No se ejecutaron pruebas de busqueda con JavLibrary ni instaladores.
          - No se modificaron los ejecutables de la RC1 ni el proyecto WebView2 original.

          **NO PUBLICAR TODAVIA:** pendiente validacion funcional Windows, licencias de recursos/dependencias y fuentes/receta del PAR.
          EOF
          git add docs/RESULTADO_COMPILACION_PUBLICA_DESARROLLO.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Informe ya actualizado."
            exit 0
          fi
          git commit -m "ci: confirmar compilacion aislada de nueva edicion publica"
          git pull --rebase origin edicion-publica-desarrollo
          git push origin HEAD:edicion-publica-desarrollo
