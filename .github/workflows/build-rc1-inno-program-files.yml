name: Compilar RC1 con Inno Setup (Program Files)

on:
  push:
    branches: [rc-0.8.1-inno-setup-program-files]
    paths:
      - 'installer-rc1-github/**'
      - '.github/workflows/build-rc1-inno-program-files.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inno-setup:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
      - name: Descargar payload integrado de la release privada
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build-rc1 | Out-Null
          gh release download v0.8.1-rc1 --pattern "JAVkt9_0.8.1_RC1_GITHUB_CANDIDATA_Setup_Windows_x64.exe" --dir build-rc1
          if ($LASTEXITCODE -ne 0) { throw "No se pudo descargar el asset de la release privada" }
          if (!(Test-Path "build-rc1/JAVkt9_0.8.1_RC1_GITHUB_CANDIDATA_Setup_Windows_x64.exe")) { throw "Falta el EXE integrado" }
      - name: Extraer contenido original verificado sin modificar JAVkt9
        shell: pwsh
        run: |
          python installer-rc1-github/extract_candidate.py "build-rc1/JAVkt9_0.8.1_RC1_GITHUB_CANDIDATA_Setup_Windows_x64.exe" "installer-rc1-github/Payload"
          if ($LASTEXITCODE -ne 0) { throw "El payload no pasó verificación" }
      - name: Instalar Inno Setup 6
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }
          }
      - name: Compilar instalador visual Windows x64
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer-rc1-github/JavKT9.iss"
          if ($LASTEXITCODE -ne 0) { throw "Fallo compilacion Inno Setup" }
          $exe = "output-rc1-github/JAVkt9-0.8.1-RC1-GitHub-Setup-Windows-x64.exe"
          if (!(Test-Path $exe)) { throw "No se generó el Setup Inno" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File "output-rc1-github/SHA256.txt"
          Get-Item $exe | Select-Object Name,Length | Format-List
      - name: Guardar EXE para descarga privada
        uses: actions/upload-artifact@v4
        with:
          name: JAVkt9-0.8.1-RC1-Inno-Setup-Program-Files
          path: |
            output-rc1-github/JAVkt9-0.8.1-RC1-GitHub-Setup-Windows-x64.exe
            output-rc1-github/SHA256.txt
          if-no-files-found: error
          retention-days: 30
