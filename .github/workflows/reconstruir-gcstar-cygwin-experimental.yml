name: Reconstruir GCstar con Cygwin GTK3 (experimental)

on:
  push:
    branches: [experimento-gcstar-par-rc1]
    paths:
      - 'tools/build_gcstar_cygwin_experimental.sh'
      - 'tools/rebuild_gcstar_cygwin_retry.ps1'
      - '.github/workflows/reconstruir-gcstar-cygwin-experimental.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cygwin-par:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Obtener fuentes privadas sin modificar RC1
        uses: actions/checkout@v4

      - name: Instalar Cygwin GTK3 PAR con paquetes oficiales
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'setup-x86_64.exe'
          $root = 'C:\cygwin64'
          $cache = Join-Path $env:RUNNER_TEMP 'cygwin-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Invoke-WebRequest -Uri 'https://cygwin.com/setup-x86_64.exe' -OutFile $setup -ErrorAction Stop
          $packages = 'perl,perl-Gtk3,perl-Glib,perl-Glib-Object-Introspection,perl-Cairo,perl-Pango,perl-PAR-Packer,perl-XML-Simple,perl-Encode-Locale,perl-URI,perl-libwww-perl,perl-HTML-Parser,perl-JSON,perl-XML-LibXML,perl-DateTime,perl-DateTime-Format-Strptime,perl-Image-ExifTool,perl-GD,perl-HTTP-Message,make,tar,gzip,girepository-Gtk3.0'
          # setup inicia un proceso Windows separado; esperar su finalizacion real.
          $args = @('-q', '-n', '-N', '-R', $root, '-l', $cache, '-s', 'https://mirrors.kernel.org/sourceware/cygwin/', '-P', $packages)
          $process = Start-Process -FilePath $setup -ArgumentList $args -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Fallo instalacion de Cygwin: codigo $($process.ExitCode)" }
          if (!(Test-Path "$root\bin\bash.exe") -or !(Test-Path "$root\bin\perl.exe")) {
            throw 'Instalacion Cygwin incompleta'
          }
          Write-Host "OK: Cygwin instalado en el runner temporal (no en el equipo del usuario)"

      - name: Instalar Gtk3 SimpleList desde CPAN (modulo LGPL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\cygwin64\bin\bash.exe' -lc 'PERL_MM_USE_DEFAULT=1 perl -MCPAN -e "CPAN::Shell->notest(q(install),q(Gtk3::SimpleList))"'
          if ($LASTEXITCODE -ne 0) { throw "Fallo CPAN Gtk3::SimpleList" }
          & 'C:\cygwin64\bin\bash.exe' -lc 'PERL5LIB="$HOME/perl5/lib/perl5" perl -MGtk3::SimpleList -e "print qq(Gtk3::SimpleList disponible\n)"'
          if ($LASTEXITCODE -ne 0) { throw "Gtk3::SimpleList sigue ausente" }

      - name: Comprobar GTK3 y compilar GCstar experimental con Cygwin PAR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Reutilizar el mismo Cygwin instalado para módulos que GCstar vaya solicitando.
          & pwsh -NoProfile -File tools/rebuild_gcstar_cygwin_retry.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "La reconstruccion experimental sigue incompleta; revisar dependencia o codigo"
          }

      - name: Probar arranque y preparar registro de procedencia
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe'
          if (!(Test-Path $exe)) { throw "La compilacion no genero un exe" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          # Mantener el arbol de fuentes como referencia para la prueba CLI.
          Copy-Item $exe 'src/perl/bin/gcstar-cygwin-experimental.exe'
          & 'C:\cygwin64\bin\bash.exe' -lc 'cd "$(cygpath -u "$GITHUB_WORKSPACE")" && timeout 25s ./src/perl/bin/gcstar-cygwin-experimental.exe --version'
          if ($LASTEXITCODE -ne 0) {
            throw "El EXE experimental no supera arranque --version (codigo $LASTEXITCODE)"
          }
          Write-Host "Smoke test OK; aun NO valida interfaz grafica, dependencias ni distribucion legal."

      - name: Preparar manifiesto de compilacion y dependencias
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe'
          if (!(Test-Path $exe)) { throw "No existe EXE experimental" }
          $out = 'out-gcstar-cygwin-experimental'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $embeddedSource = (Get-FileHash 'src/perl/par_embebido/script/gcstar.pl' -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines = @(
            "EXPERIMENTAL: NO PUBLICAR NI REEMPLAZAR RC1 APROBADA",
            "Rama: experimento-gcstar-par-rc1",
            "Commit: ${{ github.sha }}",
            "Script principal: src/perl/par_embebido/script/gcstar.pl (GCstar 1.7.3)",
            "SHA-256 fuente script: $embeddedSource",
            "SHA-256 EXE: $hash",
            "Runtime: Cygwin Perl/GTK3/PAR; requiere DLL y entorno Cygwin.",
            "Prueba automatica: solo gcstar --version; NO se probo la GUI.",
            "Fuentes y avisos de terceros todavia no auditados."
          )
          Set-Content -Path (Join-Path $out "MANIFIESTO_EXPERIMENTAL.txt") -Value $lines -Encoding utf8
          & 'C:\cygwin64\bin\bash.exe' -lc 'cygcheck -c' | Out-File (Join-Path $out "CYGWIN_PAQUETES_INSTALADOS.txt") -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "No se pudo inventariar Cygwin" }
          & 'C:\cygwin64\bin\bash.exe' -lc 'cygcheck "$(cygpath -u "$GITHUB_WORKSPACE")/out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe"' |
            Out-File (Join-Path $out "CYGWIN_DLL_DIAGNOSTICO.txt") -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "No se pudo diagnosticar dependencias DLL" }

      - name: Auditar portabilidad y registrar licencias pendientes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $exe = Join-Path $out 'gcstar-cygwin-experimental.exe'
          $report = @(
            'ESTADO: EXPERIMENTAL - NO APTO PARA DISTRIBUCION',
            'El test --version se ejecuto con Cygwin instalado en el runner.',
            'No se ha probado una maquina Windows limpia ni la interfaz GTK3.',
            'cygcheck enumera DLL detectadas, pero no prueba portabilidad.',
            'El inventario cygcheck -c enumera paquetes instalados, NO licencias verificadas.',
            'Revisar expresamente Cygwin runtime (GPL y excepcion de enlace), GTK3, Perl, PAR y dependencias transitivas.',
            'NO copiar DLL del runner Windows/Java al instalador.',
            'PENDIENTE: atribuciones, fuentes correspondientes, licencias y prueba GUI en VM limpia.'
          )
          Set-Content (Join-Path $out 'AUDITORIA_PENDIENTES.txt') $report -Encoding utf8
          $dlls = & 'C:\cygwin64\bin\bash.exe' -lc 'cygcheck "$(cygpath -u "$GITHUB_WORKSPACE")/out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe"'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo ejecutar cygcheck' }
          $dlls | Where-Object { $_ -match 'cygwin64|\.dll' } |
            Sort-Object -Unique |
            Set-Content (Join-Path $out 'DEPENDENCIAS_DETECTADAS.txt') -Encoding utf8

      - name: Diagnostico de portabilidad sin Cygwin en PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $exe = (Resolve-Path (Join-Path $out 'gcstar-cygwin-experimental.exe')).Path
          $report = Join-Path $out 'PRUEBA_PATH_LIMPIO.txt'
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $stdout = Join-Path $env:RUNNER_TEMP 'gcstar-path-clean-stdout.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'gcstar-path-clean-stderr.txt'
            $p = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $p.WaitForExit(20000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $status = 'TIMEOUT (20 segundos)'
            } else {
              $status = "Codigo de salida: $($p.ExitCode)"
            }
            @(
              'DIAGNOSTICO LIMITADO: Windows runner con PATH reducido, NO VM limpia.',
              $status,
              'La GUI no se ha probado. Un resultado positivo NO autoriza distribucion.',
              'stdout:', (Get-Content $stdout -Raw -ErrorAction SilentlyContinue),
              'stderr:', (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
            ) | Set-Content $report -Encoding utf8
          } catch {
            @('DIAGNOSTICO FALLIDO, no bloquea la compilacion.', $_.Exception.Message) | Set-Content $report -Encoding utf8
          } finally {
            $env:PATH = $oldPath
          }

      - name: Identificar DLL directas y probar Cygwin aislado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $exe = (Resolve-Path (Join-Path $out 'gcstar-cygwin-experimental.exe')).Path
          $report = Join-Path $out 'DIAGNOSTICO_DLL_AISLADO.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR - DIAGNOSTICO, NO VALIDACION GUI')
          $lines.Add('0xC0000135 = STATUS_DLL_NOT_FOUND; PATH limpio anterior fallo.')
          $lines.Add('DLL importadas directamente por el EXE (objdump):')
          $bash = 'C:\cygwin64\bin\bash.exe'
          $obj = & $bash -lc 'objdump -p "$(cygpath -u "$GITHUB_WORKSPACE")/out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe" | grep "DLL Name:"'
          foreach ($entry in $obj) { $lines.Add([string]$entry) }
          $lines.Add('Prueba controlada: directorio aislado con SOLO cygwin1.dll al lado del EXE.')
          $tmp = Join-Path $env:RUNNER_TEMP 'gcstar-isolated'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item $exe (Join-Path $tmp 'gcstar-cygwin-experimental.exe')
          Copy-Item 'C:\cygwin64\bin\cygwin1.dll' (Join-Path $tmp 'cygwin1.dll')
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $stdout = Join-Path $tmp 'stdout.txt'
            $stderr = Join-Path $tmp 'stderr.txt'
            try {
              $p = Start-Process -FilePath (Join-Path $tmp 'gcstar-cygwin-experimental.exe') -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              if (-not $p.WaitForExit(20000)) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                $lines.Add('Resultado: TIMEOUT 20 segundos')
              } else {
                $lines.Add("Resultado: codigo $($p.ExitCode)")
              }
              $lines.Add('stdout:')
              $lines.Add([string](Get-Content $stdout -Raw -ErrorAction SilentlyContinue))
              $lines.Add('stderr:')
              $lines.Add([string](Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
            } catch {
              $lines.Add("Error de inicio: $($_.Exception.Message)")
            }
          } finally {
            $env:PATH = $oldPath
          }
          $lines.Add('No se copiaron otras DLL ni se ha probado GTK3/GUI en Windows limpio.')
          $lines | Set-Content $report -Encoding utf8

      - name: Inventariar dependencias directas del runtime Perl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'C:\cygwin64\bin\cygperl5_44.dll'
          if (!(Test-Path $runtime)) { throw 'Runtime Perl no encontrado' }
          $output = @(
            'EXPERIMENTAL: inventario tecnico, NO autoriza distribucion.',
            'El ensayo anterior identifico cygperl5_44.dll como biblioteca ausente.',
            'Importaciones directas del runtime Perl:'
          )
          $imports = & 'C:\cygwin64\bin\bash.exe' -lc 'objdump -p /usr/bin/cygperl5_44.dll | grep "DLL Name:"'
          if ($LASTEXITCODE -ne 0) { throw 'Fallo inventario del runtime Perl' }
          $output += $imports
          $output += 'Pendiente: dependencias transitivas, recursos GTK3, licencias y GUI.'
          $output | Set-Content 'out-gcstar-cygwin-experimental/IMPORTACIONES_PERL.txt' -Encoding utf8

      - name: Probar runtime Perl aislado con DLL directas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $temp = Join-Path $env:RUNNER_TEMP 'gcstar-perl-runtime-test'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          Copy-Item (Join-Path $out 'gcstar-cygwin-experimental.exe') $temp
          $dllNames = @('cygwin1.dll', 'cygperl5_44.dll', 'cygcrypt-2.dll', 'cyggcc_s-seh-1.dll')
          foreach ($name in $dllNames) {
            $source = Join-Path 'C:\cygwin64\bin' $name
            if (!(Test-Path $source)) { throw "DLL de prueba no encontrada: $name" }
            Copy-Item $source $temp
          }
          $lines = @('EXPERIMENTAL - NO PUBLICAR', 'Solo prueba --version; no verifica GUI, licencias ni Windows limpio.', "DLL copiadas al directorio temporal: $($dllNames -join ', ')")
          $previousPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $stdout = Join-Path $temp 'stdout.txt'
            $stderr = Join-Path $temp 'stderr.txt'
            try {
              $proc = Start-Process -FilePath (Join-Path $temp 'gcstar-cygwin-experimental.exe') -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              if ($proc.WaitForExit(20000)) {
                $lines += "Codigo de salida: $($proc.ExitCode)"
              } else {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                $lines += 'TIMEOUT: 20 segundos'
              }
              $lines += 'stdout:'
              $lines += [string](Get-Content $stdout -Raw -ErrorAction SilentlyContinue)
              $lines += 'stderr:'
              $lines += [string](Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
            } catch {
              $lines += "Error de inicio: $($_.Exception.Message)"
            }
          } finally {
            $env:PATH = $previousPath
          }
          $lines | Set-Content (Join-Path $out 'PRUEBA_RUNTIME_PERL_AISLADO.txt') -Encoding utf8

      - name: Analizar DLL transitivas y bibliotecas PAR extraidas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $report = Join-Path $out 'ANALISIS_DLL_TRANSITIVAS_PAR.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR - solo inventario, no valida GUI ni licencias.')
          $bash = 'C:\cygwin64\bin\bash.exe'
          $names = @('cygwin1.dll', 'cygperl5_44.dll', 'cygcrypt-2.dll', 'cyggcc_s-seh-1.dll')
          foreach ($name in $names) {
            $lines.Add("=== Importaciones directas de $name ===")
            $unixPath = "/usr/bin/$name"
            $output = & $bash -lc "objdump -p '$unixPath' | grep 'DLL Name:'"
            if ($LASTEXITCODE -ne 0) {
              $lines.Add('Sin importaciones detectadas o fallo de objdump.')
            } else {
              foreach ($entry in $output) { $lines.Add([string]$entry) }
            }
          }
          $lines.Add('=== Bibliotecas extraidas por PAR en cache temporal ===')
          $cacheRoots = @(Get-ChildItem -Path $env:TEMP -Directory -Filter 'par-*' -ErrorAction SilentlyContinue)
          $found = 0
          foreach ($root in $cacheRoots) {
            Get-ChildItem -Path $root.FullName -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in @('.dll','.so') -or $_.Name -match '\\.dll\\.' } |
              ForEach-Object {
                $lines.Add($_.FullName.Replace($env:RUNNER_TEMP, '<RUNNER_TEMP>'))
                $found++
              }
          }
          $lines.Add("Archivos encontrados: $found")
          $lines.Add('Nota: un inventario de archivos no identifica por si solo la DLL que fallo con nombre ?. Revisar salida y dependencias dinamicas.')
          $lines | Set-Content $report -Encoding utf8

      - name: Rastrear carga dinamica y cache PAR sin modificar RC1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $report = Join-Path $out 'RASTREO_CARGA_PAR.txt'
          $exe = (Resolve-Path (Join-Path $out 'gcstar-cygwin-experimental.exe')).Path
          $sandbox = Join-Path $env:RUNNER_TEMP 'gcstar-trace-isolated'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          Copy-Item $exe (Join-Path $sandbox 'gcstar-cygwin-experimental.exe')
          $dlls = @('cygwin1.dll', 'cygperl5_44.dll', 'cygcrypt-2.dll', 'cyggcc_s-seh-1.dll')
          foreach ($dll in $dlls) {
            Copy-Item (Join-Path 'C:\cygwin64\bin' $dll) (Join-Path $sandbox $dll)
          }
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR - DIAGNOSTICO CLI; GUI y licencias pendientes.')
          $lines.Add('Se comprueba la carga de DLL con PATH reducido y la cache PAR.')
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $stdout = Join-Path $sandbox 'stdout.txt'
            $stderr = Join-Path $sandbox 'stderr.txt'
            $target = Join-Path $sandbox 'gcstar-cygwin-experimental.exe'
            try {
              $proc = Start-Process -FilePath $target -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              if ($proc.WaitForExit(20000)) {
                $lines.Add("Codigo de salida: $($proc.ExitCode)")
              } else {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                $lines.Add('TIMEOUT 20 segundos')
              }
              $lines.Add('stdout: ' + [string](Get-Content $stdout -Raw -ErrorAction SilentlyContinue))
              $lines.Add('stderr: ' + [string](Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
            } catch {
              $lines.Add("Fallo al iniciar: $($_.Exception.Message)")
            }
          } finally {
            $env:PATH = $oldPath
          }
          $lines.Add('DLL presentes en directorio aislado:')
          foreach ($dll in (Get-ChildItem $sandbox -Filter '*.dll' -File)) { $lines.Add($dll.Name) }
          $lines.Add('DLL extraidas a cache PAR (nombres):')
          foreach ($folder in (Get-ChildItem $env:TEMP -Directory -Filter 'par-*' -ErrorAction SilentlyContinue)) {
            foreach ($item in (Get-ChildItem $folder.FullName -Recurse -File -ErrorAction SilentlyContinue)) {
              if ($item.Extension -eq '.dll') { $lines.Add($item.Name) }
            }
          }
          $lines.Add('El inventario no registra intentos de carga de DLL a nivel de proceso.')
          $lines | Set-Content $report -Encoding utf8

      - name: Diagnosticar carga con strace de Cygwin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $report = Join-Path $out 'STRACE_CYGWIN_CARGA.txt'
          $trace = Join-Path $env:RUNNER_TEMP 'gcstar-cygwin-strace.log'
          $sandbox = Join-Path $env:RUNNER_TEMP 'gcstar-strace-isolated'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          Copy-Item (Join-Path $out 'gcstar-cygwin-experimental.exe') $sandbox
          foreach ($dll in @('cygwin1.dll','cygperl5_44.dll','cygcrypt-2.dll','cyggcc_s-seh-1.dll')) {
            Copy-Item (Join-Path 'C:\cygwin64\bin' $dll) $sandbox
          }
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Rastreo CLI con Cygwin strace; no prueba GUI, licencias ni portabilidad.')
          $strace = 'C:\cygwin64\bin\strace.exe'
          if (!(Test-Path $strace)) {
            $lines.Add('strace.exe no disponible en la instalacion Cygwin del runner.')
          } else {
            $oldPath = $env:PATH
            try {
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              $target = Join-Path $sandbox 'gcstar-cygwin-experimental.exe'
              $stdout = Join-Path $sandbox 'strace-stdout.txt'
              $stderr = Join-Path $sandbox 'strace-stderr.txt'
              try {
                $proc = Start-Process -FilePath $strace -ArgumentList @('-f','-o',('"' + $trace + '"'),('"' + $target + '"'),'--version') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                if ($proc.WaitForExit(30000)) {
                  $lines.Add("Codigo de salida de strace: $($proc.ExitCode)")
                } else {
                  Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                  $lines.Add('TIMEOUT 30 segundos')
                }
                $lines.Add('stderr: ' + [string](Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
              } catch {
                $lines.Add("Error al ejecutar strace: $($_.Exception.Message)")
              }
            } finally {
              $env:PATH = $oldPath
            }
            if (Test-Path $trace) {
              $lines.Add('=== Eventos de error o busqueda de bibliotecas (hasta 150) ===')
              $matches = @(Select-String -Path $trace -Pattern 'dll|\.so|ENOENT|error|failed|cannot open|openat' -ErrorAction SilentlyContinue | Select-Object -Last 150)
              foreach ($match in $matches) { $lines.Add($match.Line) }
              $lines.Add('=== Ultimas 80 lineas del rastreo ===')
              foreach ($line in (Get-Content $trace -Tail 80)) { $lines.Add($line) }
            } else {
              $lines.Add('strace no genero archivo de rastreo.')
            }
          }
          $lines | Set-Content $report -Encoding utf8

      - name: Comparar ejecutable extraido de PAR y DLL disponibles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $report = Join-Path $out 'COMPARACION_PAR_DLL.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Inventario de dependencias; no verifica GUI ni licencias.')
          $cacheFiles = @(Get-ChildItem -Path $env:TEMP -Directory -Filter 'par-*' -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem -Path $_.FullName -Recurse -File -Filter 'gcstar-cygwin-experimental' -ErrorAction SilentlyContinue
          })
          $objdump = 'C:\cygwin64\bin\objdump.exe'
          $cygBin = 'C:\cygwin64\bin'
          $lines.Add("Ejecutables extraidos encontrados: $($cacheFiles.Count)")
          foreach ($file in $cacheFiles) {
            $lines.Add('=== Ejecutable extraido ===')
            $lines.Add("Tamano: $($file.Length) bytes")
            $imports = @(& $objdump -p $file.FullName 2>&1 | Select-String 'DLL Name:')
            foreach ($entry in $imports) {
              $line = [string]$entry
              $lines.Add($line)
              if ($line -match 'DLL Name:\s*(\S+)') {
                $name = $Matches[1]
                if ($name -match '^(?i:api-ms-|ext-ms-|kernel32\.dll$|ntdll\.dll$|user32\.dll$|advapi32\.dll$|gdi32\.dll$)') {
                  $lines.Add("  Biblioteca Windows (no copiar): $name")
                } else {
                  $inCache = Test-Path (Join-Path $file.DirectoryName $name)
                  $inCygwin = Test-Path (Join-Path $cygBin $name)
                  $lines.Add("  En cache PAR: $inCache; en Cygwin bin: $inCygwin")
                }
              }
            }
            $lines.Add('=== DLL en la carpeta extraida ===')
            foreach ($dll in (Get-ChildItem $file.DirectoryName -Filter '*.dll' -File -ErrorAction SilentlyContinue)) {
              $lines.Add($dll.Name)
            }
          }
          if ($cacheFiles.Count -eq 0) { $lines.Add('No se encontro el ejecutable extraido; PAR puede haber limpiado su cache.') }
          $lines.Add('NOTA: importaciones estaticas no incluyen bibliotecas cargadas dinamicamente.')
          $lines | Set-Content $report -Encoding utf8

      - name: Probar ejecutable PAR con DLL faltantes en cache temporal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $report = Join-Path $out 'PRUEBA_DLL_EN_CACHE_PAR.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Prueba aislada CLI, sin cambios al empaquetado distribuido.')
          $extracted = @(Get-ChildItem $env:TEMP -Directory -Filter 'par-*' -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Recurse -File -Filter 'gcstar-cygwin-experimental' -ErrorAction SilentlyContinue
          })
          $lines.Add("Ejecutables PAR encontrados: $($extracted.Count)")
          foreach ($file in $extracted) {
            $lines.Add('=== Prueba en copia aislada de la cache PAR ===')
            $testDir = Join-Path $env:RUNNER_TEMP 'par-dll-retest'
            New-Item -ItemType Directory -Force $testDir | Out-Null
            Copy-Item (Join-Path $file.DirectoryName '*') $testDir -Recurse -Force
            foreach ($dll in @('cygwin1.dll','cyggcc_s-seh-1.dll')) {
              $src = Join-Path 'C:\cygwin64\bin' $dll
              if (!(Test-Path $src)) { throw "DLL de prueba ausente: $dll" }
              Copy-Item $src $testDir -Force
              $lines.Add("DLL agregada solo a copia temporal: $dll")
            }
            $exe = Join-Path $testDir 'gcstar-cygwin-experimental'
            $stdout = Join-Path $testDir 'test-stdout.txt'
            $stderr = Join-Path $testDir 'test-stderr.txt'
            $oldPath = $env:PATH
            try {
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              try {
                $p = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                if ($p.WaitForExit(30000)) {
                  $p.Refresh()
                  $lines.Add("Codigo de salida: $($p.ExitCode)")
                } else {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                  $lines.Add('TIMEOUT 30 segundos')
                }
              } catch {
                $lines.Add("Error al ejecutar: $($_.Exception.Message)")
              }
            } finally {
              $env:PATH = $oldPath
            }
            $lines.Add('stdout: ' + [string](Get-Content $stdout -Raw -ErrorAction SilentlyContinue))
            $lines.Add('stderr: ' + [string](Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          }
          if ($extracted.Count -eq 0) { $lines.Add('Sin cache PAR; no se pudo realizar la prueba.') }
          $lines.Add('Esta prueba no demuestra portabilidad, GUI ni cumplimiento de licencias.')
          $lines | Set-Content $report -Encoding utf8

      - name: Mostrar resultado real de prueba DLL en logs
        shell: pwsh
        run: |
          $report = 'out-gcstar-cygwin-experimental/PRUEBA_DLL_EN_CACHE_PAR.txt'
          if (!(Test-Path $report)) { throw 'No existe el informe de prueba de DLL' }
          Write-Host '=== RESULTADO REAL DE LA PRUEBA PAR DLL ==='
          Get-Content $report | ForEach-Object { Write-Host $_ }
          Write-Host '=== FIN DEL INFORME ==='
          Write-Host 'NOTA: una ejecucion exitosa del workflow no implica que GCstar sea portable.'

      - name: Diagnosticar modulos Perl faltantes en entorno aislado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'out-gcstar-cygwin-experimental/DIAGNOSTICO_MODULOS_PERL_PAR.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Solo inventario, sin cambios a distribucion.')
          $bash = 'C:\cygwin64\bin\bash.exe'
          foreach ($module in @('PAR','File::Temp','PAR::Heavy','Archive::Zip')) {
            $lines.Add("=== Modulo: $module ===")
            $env:GCSTAR_CHECK_MODULE = $module
            $output = @(& $bash -lc "perl -M$module -e 1" 2>&1)
            $lines.Add("Codigo: $LASTEXITCODE")
            foreach ($line in $output) { $lines.Add([string]$line) }
          }
          Remove-Item Env:GCSTAR_CHECK_MODULE -ErrorAction SilentlyContinue
          $lines.Add('=== Ubicaciones habituales ===')
          foreach ($base in @('C:\cygwin64\usr\share\perl5','C:\cygwin64\usr\lib\perl5','C:\cygwin64\usr\local\share\perl5','C:\cygwin64\usr\local\lib\perl5')) {
            foreach ($rel in @('PAR.pm','File\Temp.pm')) {
              $found = @(Get-ChildItem $base -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName.EndsWith($rel,[StringComparison]::OrdinalIgnoreCase) } | Select-Object -First 3 -ExpandProperty FullName)
              foreach ($item in $found) { $lines.Add("$rel : $item") }
            }
          }
          $lines.Add('NOTA: esta prueba no acredita GUI, portabilidad ni licencias.')
          $lines | Set-Content $report -Encoding utf8
          Get-Content $report | ForEach-Object { Write-Host $_ }

      - name: Inspeccionar modulos realmente extraidos por PAR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'out-gcstar-cygwin-experimental/MODULOS_EXTRAIDOS_PAR.txt',
            'out-gcstar-cygwin-experimental/INSPECCION_ARCHIVO_PAR.txt',
            'out-gcstar-cygwin-experimental/COMPARACION_EJECUTABLE_COMPLETO_AUXILIAR.txt',
            'out-gcstar-cygwin-experimental/DEPENDENCIAS_DLL_EXE_Y_PAR.txt',
            'out-gcstar-cygwin-experimental/PRUEBA_RUNTIME_SIN_PAR.txt',
            'out-gcstar-cygwin-experimental/CONTRASTE_PATH_CYGWIN.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Inventario de cache PAR, no prueba GUI.')
          $roots = @(Get-ChildItem $env:TEMP -Directory -Filter 'par-*' -ErrorAction SilentlyContinue)
          $files = @()
          foreach ($root in $roots) {
            $files += @(Get-ChildItem $root.FullName -Recurse -File -ErrorAction SilentlyContinue)
          }
          $lines.Add("Archivos extraidos encontrados: $($files.Count)")
          foreach ($pattern in @('PAR.pm','Heavy.pm','Temp.pm','Zip.pm','par-*.zip')) {
            $lines.Add("=== Busqueda: $pattern ===")
            $matches = @($files | Where-Object { $_.Name -like $pattern } | Select-Object -First 30 -ExpandProperty FullName)
            if ($matches.Count -eq 0) { $lines.Add('NO ENCONTRADO en cache PAR') }
            foreach ($item in $matches) { $lines.Add($item) }
          }
          $lines.Add('NOTA: ausencia en cache no demuestra ausencia dentro del archivo empaquetado.')
          $lines | Set-Content $report -Encoding utf8
          Get-Content $report | ForEach-Object { Write-Host $_ }

      - name: Inspeccionar archivo PAR y directorio exacto de extraccion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'out-gcstar-cygwin-experimental'
          $report = Join-Path $out 'INSPECCION_ARCHIVO_PAR.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Diagnostico de archivo PAR y rutas, sin validar portabilidad.')
          $exe = Join-Path $out 'gcstar-cygwin-experimental.exe'
          $lines.Add("EXE presente: $(Test-Path $exe)")
          $lines.Add('=== Contenido interno segun unzip -l (si es ZIP/PAR legible) ===')
          $bash = 'C:\cygwin64\bin\bash.exe'
          $env:GCSTAR_EXE_WIN = (Resolve-Path $exe).Path
          $cmd = 'unzip -l "$(cygpath -u "$GCSTAR_EXE_WIN")"'
          # Cygwin bash login puede limpiar variables de entorno; pasar ruta por argumento.
          $cygpath = @(& 'C:\cygwin64\bin\cygpath.exe' -u $env:GCSTAR_EXE_WIN 2>&1)
          $lines.Add("Ruta Windows: $env:GCSTAR_EXE_WIN")
          $lines.Add("Ruta Cygwin: $($cygpath -join ' ')")
          if ($LASTEXITCODE -eq 0 -and $cygpath.Count -eq 1) {
            $safePath = ([string]$cygpath[0]).Replace("'", "'\\''")
            # PowerShell 7 puede elevar stderr nativo con ErrorActionPreference=Stop.
            # unzip=9 indica formato/ruta no legible; debe quedar registrado, no abortar.
            $previousPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $output = @(& $bash -lc "unzip -l '$safePath'" 2>&1)
              $unzipExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousPreference
            }
            $lines.Add("Codigo unzip: $unzipExit")
            foreach ($line in $output | Select-Object -First 200) { $lines.Add([string]$line) }
            if ($unzipExit -ne 0) { $lines.Add('Inspeccion ZIP no disponible; se continua con inventario de cache PAR.') }
          } else {
            $lines.Add('No se pudo convertir la ruta a Cygwin; inspeccion ZIP omitida.')
          }
          $lines.Add('=== Archivos PAR encontrados en rutas temporales conocidas ===')
          foreach ($base in @($env:TEMP,$env:TMP,$env:RUNNER_TEMP)) {
            $lines.Add("Base: $base")
            if (!(Test-Path $base)) { continue }
            $dirs = @(Get-ChildItem $base -Directory -Filter 'par-*' -ErrorAction SilentlyContinue)
            foreach ($dir in $dirs) {
              $lines.Add("PAR dir: $($dir.FullName)")
              $items = @(Get-ChildItem $dir.FullName -Recurse -File -ErrorAction SilentlyContinue)
              $lines.Add("Archivos: $($items.Count)")
              foreach ($item in $items | Select-Object -First 80) { $lines.Add($item.FullName) }
            }
          }
          Remove-Item Env:GCSTAR_EXE_WIN -ErrorAction SilentlyContinue
          $lines.Add('Un listado ZIP fallido no demuestra ausencia de modulos: pp puede usar otro formato interno.')
          $lines.Add('No se modifico el ejecutable ni se realizo prueba GUI.')
          $lines | Set-Content $report -Encoding utf8
          Get-Content $report | ForEach-Object { Write-Host $_ }
          # El ultimo comando nativo (unzip) puede dejar LASTEXITCODE=9 aunque
          # el diagnostico haya terminado; no convertirlo en fallo del workflow.
          $global:LASTEXITCODE = 0

      - name: Comparar ejecutable completo y auxiliar PAR en PATH restringido
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'out-gcstar-cygwin-experimental/COMPARACION_EJECUTABLE_COMPLETO_AUXILIAR.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Comparacion CLI, sin pruebas GUI.')
          $outer = (Resolve-Path 'out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe').Path
          $cacheRoot = Join-Path $env:TEMP 'par-*'
          $children = @(Get-ChildItem $env:TEMP -Directory -Filter 'par-*' -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Recurse -File -Filter 'gcstar-cygwin-experimental' -ErrorAction SilentlyContinue
          })
          $lines.Add("Auxiliares encontrados: $($children.Count)")
          $testDir = Join-Path $env:RUNNER_TEMP 'gcstar-full-exe-retest'
          New-Item -ItemType Directory -Force $testDir | Out-Null
          $fullExe = Join-Path $testDir 'gcstar-cygwin-experimental.exe'
          Copy-Item $outer $fullExe -Force
          foreach ($dll in @('cygwin1.dll','cyggcc_s-seh-1.dll','cygperl5_44.dll','cygcrypt-2.dll')) {
            $src = Join-Path 'C:\cygwin64\bin' $dll
            if (Test-Path $src) { Copy-Item $src $testDir -Force; $lines.Add("DLL de prueba: $dll") }
            else { $lines.Add("DLL ausente en Cygwin: $dll") }
          }
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $stdout = Join-Path $testDir 'full-stdout.txt'
            $stderr = Join-Path $testDir 'full-stderr.txt'
            try {
              $p = Start-Process -FilePath $fullExe -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              if ($p.WaitForExit(30000)) {
                $p.Refresh()
                $lines.Add("EXE completo: codigo $($p.ExitCode)")
              } else {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                $lines.Add('EXE completo: TIMEOUT 30 segundos')
              }
            } catch { $lines.Add("EXE completo: error $($_.Exception.Message)") }
            $lines.Add('EXE completo stdout: ' + [string](Get-Content $stdout -Raw -ErrorAction SilentlyContinue))
            $lines.Add('EXE completo stderr: ' + [string](Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          } finally { $env:PATH = $oldPath }
          $lines.Add('Comparar con PRUEBA_DLL_EN_CACHE_PAR.txt para resultado del auxiliar.')
          $lines.Add('Un resultado CLI positivo no valida GUI, portabilidad ni licencias.')
          $lines | Set-Content $report -Encoding utf8
          Get-Content $report | ForEach-Object { Write-Host $_ }
          $global:LASTEXITCODE = 0

      - name: Contrastar arranque EXE con y sin PATH Cygwin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'out-gcstar-cygwin-experimental/CONTRASTE_PATH_CYGWIN.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Prueba diferencial CLI con y sin bibliotecas Cygwin.')
          $exe = (Resolve-Path 'out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'gcstar-path-contrast'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $copy = Join-Path $dir 'gcstar-cygwin-experimental.exe'
          Copy-Item $exe $copy -Force
          foreach ($dll in @('cygwin1.dll','cyggcc_s-seh-1.dll','cygperl5_44.dll','cygcrypt-2.dll')) {
            $src = Join-Path 'C:\cygwin64\bin' $dll
            if (Test-Path $src) { Copy-Item $src $dir -Force }
          }
          $oldPath = $env:PATH
          try {
            foreach ($mode in @('restringido','cygwin_disponible')) {
              if ($mode -eq 'restringido') { $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot" }
              else { $env:PATH = "C:\cygwin64\bin;$env:SystemRoot\System32;$env:SystemRoot" }
              $stdout = Join-Path $dir "$mode.stdout.txt"
              $stderr = Join-Path $dir "$mode.stderr.txt"
              $lines.Add("=== Modo $mode ===")
              try {
                $p = Start-Process -FilePath $copy -ArgumentList '--version' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                if ($p.WaitForExit(30000)) {
                  $p.Refresh()
                  $lines.Add("Codigo de salida: $($p.ExitCode)")
                } else {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                  $lines.Add('TIMEOUT 30 segundos')
                }
              } catch { $lines.Add("Error al iniciar: $($_.Exception.Message)") }
              $lines.Add('stdout: ' + [string](Get-Content $stdout -Raw -ErrorAction SilentlyContinue))
              $lines.Add('stderr: ' + [string](Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
            }
          } finally { $env:PATH = $oldPath }
          $lines.Add('Si ambos modos fallan, no asumir que solo faltan DLL.')
          $lines.Add('El modo con Cygwin disponible NO es prueba de portabilidad.')
          $lines | Set-Content $report -Encoding utf8
          Get-Content $report | ForEach-Object { Write-Host $_ }
          $global:LASTEXITCODE = 0

      - name: Diagnosticar dependencias DLL del EXE completo y auxiliar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'out-gcstar-cygwin-experimental/DEPENDENCIAS_DLL_EXE_Y_PAR.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - NO PUBLICAR. Inventario estatico de DLL importadas.')
          $objdump = 'C:\cygwin64\bin\objdump.exe'
          if (!(Test-Path $objdump)) {
            $lines.Add('objdump.exe no encontrado: diagnostico omitido, no implica ausencia de DLL.')
          } else {
            $root = Join-Path $env:RUNNER_TEMP 'gcstar-full-exe-retest'
            $targets = [System.Collections.Generic.List[string]]::new()
            $targets.Add((Resolve-Path 'out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe').Path)
            if (Test-Path $root) {
              foreach ($file in Get-ChildItem $root -File | Where-Object { $_.Extension -in @('.exe','.dll') }) { $targets.Add($file.FullName) }
            }
            foreach ($dir in Get-ChildItem $env:TEMP -Directory -Filter 'par-*' -ErrorAction SilentlyContinue) {
              foreach ($file in Get-ChildItem $dir.FullName -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.exe','.dll') -or $_.Name -eq 'gcstar-cygwin-experimental' } | Select-Object -First 15) { $targets.Add($file.FullName) }
            }
            foreach ($target in $targets | Select-Object -Unique) {
              $lines.Add("=== Archivo: $target ===")
              $output = @(& $objdump -p $target 2>&1)
              $exitCode = $LASTEXITCODE
              $lines.Add("objdump codigo: $exitCode")
              if ($exitCode -ne 0) {
                foreach ($line in $output | Select-Object -First 8) { $lines.Add([string]$line) }
                continue
              }
              $imports = @($output | ForEach-Object { if ([string]$_ -match 'DLL Name:\s*(\S+)') { $Matches[1] } } | Sort-Object -Unique)
              foreach ($dll in $imports) {
                $local = Join-Path (Split-Path $target -Parent) $dll
                $cygwin = Join-Path 'C:\cygwin64\bin' $dll
                $system = Join-Path "$env:SystemRoot\System32" $dll
                $lines.Add("DLL: $dll | local=$(Test-Path $local) | cygwin=$(Test-Path $cygwin) | system32=$(Test-Path $system)")
              }
              if ($imports.Count -eq 0) { $lines.Add('Sin importaciones detectadas por objdump.') }
            }
          }
          $lines.Add('Dependencias dinamicas y carga de modulos Perl pueden no aparecer en objdump.')
          $lines.Add('La existencia de una DLL no garantiza compatibilidad ni portabilidad.')
          $lines | Set-Content $report -Encoding utf8
          Get-Content $report | ForEach-Object { Write-Host $_ }
          $global:LASTEXITCODE = 0

      - name: Probar runtime Perl GTK3 autocontenido sin PAR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = 'out-gcstar-cygwin-experimental/PRUEBA_RUNTIME_SIN_PAR.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add('EXPERIMENTAL - PRIMERA PRUEBA SIN PAR. NO PUBLICAR.')
          $root = 'C:\cygwin64'
          $stage = Join-Path $env:RUNNER_TEMP 'gcstar-runtime-sin-par'
          $bin = Join-Path $stage 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          # Copia inicial amplia de DLL para aislar el problema de PAR; se reducira despues.
          Copy-Item "$root\bin\*.dll" $bin -Force
          Copy-Item "$root\bin\perl.exe" $bin -Force
          $lines.Add("DLL copiadas: $(@(Get-ChildItem $bin -Filter '*.dll').Count)")
          $oldPath = $env:PATH
          try {
            $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"
            $env:PERL5LIB = ''
            $perl = Join-Path $bin 'perl.exe'
            foreach ($test in @(
              @{ Name='perl-version'; Args=@('-v') },
              @{ Name='gtk3-import'; Args=@('-MGtk3','-e','print qq(GTK3_IMPORT_OK\n)') }
            )) {
              $lines.Add("=== $($test.Name) ===")
              $stdout = Join-Path $stage "$($test.Name).out.txt"
              $stderr = Join-Path $stage "$($test.Name).err.txt"
              try {
                $p = Start-Process -FilePath $perl -ArgumentList $test.Args -WorkingDirectory $stage -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                if ($p.WaitForExit(20000)) { $p.Refresh(); $lines.Add("Codigo: $($p.ExitCode)") }
                else { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; $lines.Add('TIMEOUT 20s') }
              } catch { $lines.Add("Error: $($_.Exception.Message)") }
              $lines.Add('stdout: ' + [string](Get-Content $stdout -Raw -ErrorAction SilentlyContinue))
              $lines.Add('stderr: ' + [string](Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
            }
          } finally { $env:PATH = $oldPath; Remove-Item Env:PERL5LIB -ErrorAction SilentlyContinue }
          $lines.Add('Esta prueba no contiene todavia el arbol lib/share de Perl y GTK3.')
          $lines.Add('Si Gtk3 falla por rutas o modulos, es informacion diagnostica; no valida portabilidad.')
          $lines.Add('No se modifico RC1 ni se probo la interfaz grafica.')
          $lines | Set-Content $report -Encoding utf8
          Get-Content $report | ForEach-Object { Write-Host $_ }
          $global:LASTEXITCODE = 0

      - name: Guardar en release BORRADOR experimental (sin publicar RC1)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "gcstar-cygwin-experimental-${{ github.run_id }}-${{ github.run_attempt }}"
          $files = @(
            'out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe',
            'out-gcstar-cygwin-experimental/MANIFIESTO_EXPERIMENTAL.txt',
            'out-gcstar-cygwin-experimental/CYGWIN_PAQUETES_INSTALADOS.txt',
            'out-gcstar-cygwin-experimental/CYGWIN_DLL_DIAGNOSTICO.txt',
            'out-gcstar-cygwin-experimental/AUDITORIA_PENDIENTES.txt',
            'out-gcstar-cygwin-experimental/DEPENDENCIAS_DETECTADAS.txt',
            'out-gcstar-cygwin-experimental/PRUEBA_PATH_LIMPIO.txt',
            'out-gcstar-cygwin-experimental/DIAGNOSTICO_DLL_AISLADO.txt',
            'out-gcstar-cygwin-experimental/IMPORTACIONES_PERL.txt',
            'out-gcstar-cygwin-experimental/PRUEBA_RUNTIME_PERL_AISLADO.txt',
            'out-gcstar-cygwin-experimental/ANALISIS_DLL_TRANSITIVAS_PAR.txt',
            'out-gcstar-cygwin-experimental/RASTREO_CARGA_PAR.txt',
            'out-gcstar-cygwin-experimental/STRACE_CYGWIN_CARGA.txt',
            'out-gcstar-cygwin-experimental/COMPARACION_PAR_DLL.txt',
            'out-gcstar-cygwin-experimental/PRUEBA_DLL_EN_CACHE_PAR.txt',
            'out-gcstar-cygwin-experimental/DIAGNOSTICO_MODULOS_PERL_PAR.txt',
            'out-gcstar-cygwin-experimental/MODULOS_EXTRAIDOS_PAR.txt',
            'out-gcstar-cygwin-experimental/INSPECCION_ARCHIVO_PAR.txt',
            'out-gcstar-cygwin-experimental/COMPARACION_EJECUTABLE_COMPLETO_AUXILIAR.txt',
            'out-gcstar-cygwin-experimental/DEPENDENCIAS_DLL_EXE_Y_PAR.txt',
            'out-gcstar-cygwin-experimental/CONTRASTE_PATH_CYGWIN.txt',
            'out-gcstar-cygwin-experimental/PRUEBA_RUNTIME_SIN_PAR.txt'
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Archivo experimental ausente: $file" }
          }
          $notes = 'EXPERIMENTAL - NO PUBLICAR. Solo se comprobo --version. Faltan GUI, DLL, fuentes y licencias. No reemplaza la RC1.'
          gh release create $tag @files --draft --prerelease --target "${{ github.sha }}" --title "GCstar Cygwin experimental (NO PUBLICAR) $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo guardar la release experimental en borrador' }
          Write-Host "Borrador experimental creado: $tag. NO publicado."
