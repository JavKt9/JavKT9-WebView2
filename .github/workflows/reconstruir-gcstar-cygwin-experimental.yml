name: Reconstruir GCstar con Cygwin GTK3 (experimental)

on:
  push:
    branches: [experimento-gcstar-par-rc1]
    paths:
      - 'tools/build_gcstar_cygwin_experimental.sh'
      - 'tools/rebuild_gcstar_cygwin_retry.ps1'
      - '.github/workflows/reconstruir-gcstar-cygwin-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cygwin-par:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Obtener fuentes privadas sin modificar RC1
        uses: actions/checkout@v4

      - name: Instalar Cygwin GTK3 PAR con paquetes oficiales
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'setup-x86_64.exe'
          $root = 'C:\cygwin64'
          $cache = Join-Path $env:RUNNER_TEMP 'cygwin-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Invoke-WebRequest -Uri 'https://cygwin.com/setup-x86_64.exe' -OutFile $setup -ErrorAction Stop
          $packages = 'perl,perl-Gtk3,perl-Glib,perl-Glib-Object-Introspection,perl-Cairo,perl-Pango,perl-PAR-Packer,perl-XML-Simple,perl-Encode-Locale,perl-URI,perl-libwww-perl,perl-HTML-Parser,perl-JSON,perl-XML-LibXML,perl-DateTime,perl-DateTime-Format-Strptime,perl-Image-ExifTool,perl-GD,perl-HTTP-Message,make,tar,gzip,girepository-Gtk3.0'
          # setup inicia un proceso Windows separado; esperar su finalizacion real.
          $args = @('-q', '-n', '-N', '-R', $root, '-l', $cache, '-s', 'https://mirrors.kernel.org/sourceware/cygwin/', '-P', $packages)
          $process = Start-Process -FilePath $setup -ArgumentList $args -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Fallo instalacion de Cygwin: codigo $($process.ExitCode)" }
          if (!(Test-Path "$root\bin\bash.exe") -or !(Test-Path "$root\bin\perl.exe")) {
            throw 'Instalacion Cygwin incompleta'
          }
          Write-Host "OK: Cygwin instalado en el runner temporal (no en el equipo del usuario)"

      - name: Instalar Gtk3 SimpleList desde CPAN (modulo LGPL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & 'C:\cygwin64\bin\bash.exe' -lc 'PERL_MM_USE_DEFAULT=1 perl -MCPAN -e "CPAN::Shell->notest(q(install),q(Gtk3::SimpleList))"'
          if ($LASTEXITCODE -ne 0) { throw "Fallo CPAN Gtk3::SimpleList" }
          & 'C:\cygwin64\bin\bash.exe' -lc 'PERL5LIB="$HOME/perl5/lib/perl5" perl -MGtk3::SimpleList -e "print qq(Gtk3::SimpleList disponible\n)"'
          if ($LASTEXITCODE -ne 0) { throw "Gtk3::SimpleList sigue ausente" }

      - name: Comprobar GTK3 y compilar GCstar experimental con Cygwin PAR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Reutilizar el mismo Cygwin instalado para módulos que GCstar vaya solicitando.
          & pwsh -NoProfile -File tools/rebuild_gcstar_cygwin_retry.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "La reconstruccion experimental sigue incompleta; revisar dependencia o codigo"
          }

      - name: Probar arranque y preparar registro de procedencia
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe'
          if (!(Test-Path $exe)) { throw "La compilacion no genero un exe" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          # Mantener el arbol de fuentes como referencia para la prueba CLI.
          Copy-Item $exe 'src/perl/bin/gcstar-cygwin-experimental.exe'
          & 'C:\cygwin64\bin\bash.exe' -lc 'cd "$(cygpath -u "$GITHUB_WORKSPACE")" && timeout 25s ./src/perl/bin/gcstar-cygwin-experimental.exe --version'
          if ($LASTEXITCODE -ne 0) {
            throw "El EXE experimental no supera arranque --version (codigo $LASTEXITCODE)"
          }
          Write-Host "Smoke test OK; aun NO valida interfaz grafica, dependencias ni distribucion legal."

      - name: Preparar manifiesto de compilacion y dependencias
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe'
          if (!(Test-Path $exe)) { throw "No existe EXE experimental" }
          $out = 'out-gcstar-cygwin-experimental'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $embeddedSource = (Get-FileHash 'src/perl/par_embebido/script/gcstar.pl' -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines = @(
            "EXPERIMENTAL: NO PUBLICAR NI REEMPLAZAR RC1 APROBADA",
            "Rama: experimento-gcstar-par-rc1",
            "Commit: ${{ github.sha }}",
            "Script principal: src/perl/par_embebido/script/gcstar.pl (GCstar 1.7.3)",
            "SHA-256 fuente script: $embeddedSource",
            "SHA-256 EXE: $hash",
            "Runtime: Cygwin Perl/GTK3/PAR; requiere DLL y entorno Cygwin.",
            "Prueba automatica: solo gcstar --version; NO se probo la GUI.",
            "Fuentes y avisos de terceros todavia no auditados."
          )
          Set-Content -Path (Join-Path $out "MANIFIESTO_EXPERIMENTAL.txt") -Value $lines -Encoding utf8
          & 'C:\cygwin64\bin\bash.exe' -lc 'cygcheck -c' | Out-File (Join-Path $out "CYGWIN_PAQUETES_INSTALADOS.txt") -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "No se pudo inventariar Cygwin" }
          & 'C:\cygwin64\bin\bash.exe' -lc 'cygcheck "$(cygpath -u "$GITHUB_WORKSPACE")/out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe"' |
            Out-File (Join-Path $out "CYGWIN_DLL_DIAGNOSTICO.txt") -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "No se pudo diagnosticar dependencias DLL" }

      - name: Guardar ejecutable experimental privado y manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: gcstar-cygwin-PAR-SOLO-EXPERIMENTAL
          path: |
            out-gcstar-cygwin-experimental/gcstar-cygwin-experimental.exe
            out-gcstar-cygwin-experimental/MANIFIESTO_EXPERIMENTAL.txt
            out-gcstar-cygwin-experimental/CYGWIN_PAQUETES_INSTALADOS.txt
            out-gcstar-cygwin-experimental/CYGWIN_DLL_DIAGNOSTICO.txt
          if-no-files-found: error
          retention-days: 7

