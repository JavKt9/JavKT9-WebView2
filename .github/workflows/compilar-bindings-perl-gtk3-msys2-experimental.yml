name: Compilar bindings Perl GTK3 MSYS2 experimental
on:
  push:
    branches: [experimento-gcstar-par-rc1]
    paths: ['.github/workflows/compilar-bindings-perl-gtk3-msys2-experimental.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perl-bindings:
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-glib2
            curl
            tar
      - name: Preparar prerequisitos y Glib fuente
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          mkdir -p /tmp/perl-bindings
          perl -MCPAN -e 'CPAN::Shell->notest("install","ExtUtils::Depends","ExtUtils::PkgConfig")' > /tmp/perl-bindings/prereq.log 2>&1 || true
          perl -MExtUtils::Depends -MExtUtils::PkgConfig -e 'print "PREREQ_OK\n"'
          cd /tmp/perl-bindings
          curl -fsSL --retry 2 -o Glib-1.3294.tar.gz https://cpan.metacpan.org/authors/id/X/XA/XAOC/Glib-1.3294.tar.gz
          tar -xzf Glib-1.3294.tar.gz
          cd Glib-1.3294
          perl Makefile.PL > ../glib-config.log 2>&1 || { tail -60 ../glib-config.log; exit 1; }
      - name: Compilar Glib con bibliotecas dinamicas
        run: |
          set +e
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          cd /tmp/perl-bindings/Glib-1.3294 || exit 1
          ld="$(sed -n 's/^LDLOADLIBS *= *//p' Makefile | head -1)"
          fixed="$(printf '%s\n' "$ld" | perl -pe 's{"[^"]*[/\\]lib(glib-2\.0|gobject-2\.0|gthread-2\.0|gio-2\.0|gmodule-2\.0|intl)\.a"}{-l$1}g')"
          echo "GLIB_LIBS_OVERRIDDEN=$([ "$ld" != "$fixed" ] && echo yes || echo no)"
          mingw32-make LDLOADLIBS="$fixed" install > ../glib-build.log 2>&1
          rc=$?
          echo "GLIB_BUILD_EXIT=$rc"
          if [ "$rc" -ne 0 ]; then tail -65 ../glib-build.log; exit 1; fi
          perl -MGlib -e 'print "GLIB_READY $Glib::VERSION\n"' || exit 1
      - name: Diagnosticar e instalar Cairo desde CPAN
        run: |
          set +e
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          echo '=== CAIRO: configuracion y bibliotecas ==='
          perl -V:version -V:cc -V:ld -V:lddlflags
          pkg-config --modversion cairo
          pkg-config --libs cairo
          echo '=== Compilacion CPAN Cairo ==='
          timeout 900 perl -MCPAN -e 'CPAN::Shell->notest("install","Cairo")' > /tmp/perl-bindings/cairo-cpan.log 2>&1
          rc=$?
          echo "CAIRO_CPAN_EXIT=$rc (no es prueba de instalacion)"
          echo '::group::Errores Cairo y Perl_SvPV_helper'
          grep -nEi 'Perl_SvPV_helper|error:|undefined reference|fatal error|Error [0-9]+|not found' /tmp/perl-bindings/cairo-cpan.log | tail -75 | cut -c1-900 || true
          echo '::endgroup::'
          echo '::group::Ultimas 85 lineas CPAN Cairo'
          tail -85 /tmp/perl-bindings/cairo-cpan.log | cut -c1-900
          echo '::endgroup::'
          if perl -MCairo -e 'print "CAIRO_PERL_LOAD=OK version=$Cairo::VERSION\n"'; then
            echo 'CAIRO_FINAL=OK'
          else
            echo 'CAIRO_FINAL=ERROR'
            exit 1
          fi
