name: Compilar bindings Perl GTK3 MSYS2 experimental
on:
  push:
    branches: [experimento-gcstar-par-rc1]
    paths: ['.github/workflows/compilar-bindings-perl-gtk3-msys2-experimental.yml', 'installer-experimental-gcstar/**']
  workflow_dispatch:
    inputs:
      subir_instalador:
        description: 'Intentar guardar instalador (requiere cuota libre de artifacts)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
env:
  WORK: /tmp/cairo-work
jobs:
  perl-bindings:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-make
            curl
            tar
            diffutils
      - name: 0 Instalar dependencias Perl de Cairo
        run: |
          set +e
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          mkdir -p "$WORK"
          perl -MCPAN -e 'CPAN::Shell->notest("install","ExtUtils::Depends","ExtUtils::PkgConfig","Test::Number::Delta")' > "$WORK/prereq.log" 2>&1
          rc=$?
          echo "PREREQ_CPAN_EXIT=$rc"
          tail -65 "$WORK/prereq.log" | cut -c1-600
          perl -MExtUtils::Depends -MExtUtils::PkgConfig -MTest::Number::Delta -e 'print "PREREQ_OK\n"'
          exit $?
      - name: 1 Descargar Cairo 1.109 y verificar integridad
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          mkdir -p "$WORK"
          cd "$WORK"
          curl -fsSL --retry 2 -o Cairo-1.109.tar.gz https://cpan.metacpan.org/authors/id/X/XA/XAOC/Cairo-1.109.tar.gz
          echo '8219736e401c2311da5f515775de43fd87e6384b504da36a192f2b217643077f  Cairo-1.109.tar.gz' | sha256sum -c -
          tar -xzf Cairo-1.109.tar.gz
          grep -n -A14 -B12 'cairo_surface_set_mime_data' Cairo-1.109/CairoSurface.xs | head -75
      - name: 2 Aplicar parche minimo STRLEN verificado
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          cd "$WORK/Cairo-1.109"
          cp CairoSurface.xs CairoSurface.xs.orig
          cat > "$WORK/patch-cairo.pl" <<'PERL'
          use strict;
          use warnings;
          local $/;
          my $file = shift;
          open my $in, '<:raw', $file or die $!;
          my $src = <$in>;
          close $in;
          my $a = ($src =~ s/(const\s+unsigned\s+char\s*\*\s*mime_data\s*;\s*)unsigned\s+long\s+length\s*;/$1STRLEN length;/g);
          my $b = ($src =~ s/(cairo_surface_set_mime_data\s*\([^;]*?,\s*mime_data\s*,\s*)length(\s*,\s*data_destroy)/$1(unsigned long) length$2/g);
          print "PATCH_COUNTS declaration=$a call=$b\n";
          die "PATCH_APPLY=ERROR\n" unless $a == 1 && $b == 1;
          open my $out, '>:raw', $file or die $!;
          print {$out} $src;
          close $out;
          print "PATCH_APPLY=OK\n";
          PERL
          perl "$WORK/patch-cairo.pl" CairoSurface.xs
          diff -u CairoSurface.xs.orig CairoSurface.xs > "$WORK/cairo.diff" || true
          cat "$WORK/cairo.diff"
          [ "$(grep -c '^-[^-]' "$WORK/cairo.diff")" -eq 2 ]
          [ "$(grep -c '^+[^+]' "$WORK/cairo.diff")" -eq 2 ]
      - name: 3 Configurar y compilar Cairo
        run: |
          set +e
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          cd "$WORK/Cairo-1.109" || exit 1
          perl Makefile.PL > "$WORK/config.log" 2>&1
          rc=$?
          echo "CONFIG_EXIT=$rc"
          tail -55 "$WORK/config.log"
          if [ "$rc" -ne 0 ]; then exit 1; fi
          mingw32-make -k > "$WORK/build.log" 2>&1
          rc=$?
          echo "MAKE_EXIT=$rc"
          echo "SVPV_HELPER_ERRORS=$(grep -c 'Perl_SvPV_helper' "$WORK/build.log" || true)"
          echo '::group::Errores de compilacion'
          grep -nE 'error:|undefined reference|Error [0-9]+' "$WORK/build.log" | head -65 | cut -c1-600 || true
          echo '::endgroup::'
          tail -45 "$WORK/build.log" | cut -c1-900
          if [ "$rc" -ne 0 ]; then
            if grep -q 'undefined reference' "$WORK/build.log"; then
              echo '=== Diagnostico de bibliotecas Cairo ==='
              grep '^LDLOADLIBS *=' Makefile || true
              ls -l /ucrt64/lib/libcairo.a /ucrt64/lib/libcairo.dll.a 2>&1 || true
              echo "STATIC_IMP_SYMBOLS=$(nm -A /ucrt64/lib/libcairo.a 2>/dev/null | grep -c '__imp_cairo_surface_set_mime_data' || true)"
              echo "IMPORT_IMP_SYMBOLS=$(nm -A /ucrt64/lib/libcairo.dll.a 2>/dev/null | grep -c '__imp_cairo_surface_set_mime_data' || true)"
              ld="$(sed -n 's/^LDLOADLIBS *= *//p' Makefile | head -1)"
              fixed="$(printf '%s\n' "$ld" | perl -pe 's{\x22[^\x22]*libcairo\.a\x22}{-lcairo}g; s{\x22[^\x22]*libfreetype\.a\x22}{-lfreetype}g')"
              echo "LDLOADLIBS_CHANGED=$([ "$ld" != "$fixed" ] && echo yes || echo no)"
              echo "LDLOADLIBS_FIXED=$fixed"
              if [ "$ld" != "$fixed" ]; then
                mingw32-make LDLOADLIBS="$fixed" > "$WORK/relink.log" 2>&1
                rc=$?
                echo "RELINK_EXIT=$rc"
                tail -45 "$WORK/relink.log" | cut -c1-900
              fi
            fi
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          fi
          mingw32-make ${fixed:+LDLOADLIBS="$fixed"} install > "$WORK/install.log" 2>&1
          rc=$?
          echo "INSTALL_EXIT=$rc"
          tail -30 "$WORK/install.log"
          exit "$rc"
      - name: 4 Verificar carga y operacion real de Cairo
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          perl -MCairo -e 'print "CAIRO_PERL_LOAD=OK version=$Cairo::VERSION\n"'
          perl -MCairo -e 'my $s=Cairo::ImageSurface->create("argb32",16,16); my $c=Cairo::Context->create($s); $c->set_source_rgb(1,0,0); $c->paint; $s->flush; my $p=unpack("V",substr($s->get_data,0,4)); die sprintf("PIXEL_ERROR=%08X\n",$p) unless $p == 0xFFFF0000; print "CAIRO_FUNCTIONAL=OK\n";'
          perl -MCairo -e 'my $s=Cairo::ImageSurface->create("argb32",16,16); my $v="mime-\0-data"; $s->set_mime_data("image/jpeg",$v); my $r=$s->get_mime_data("image/jpeg"); die "MIME_MISMATCH\n" unless defined $r && $r eq $v; print "CAIRO_SET_MIME_DATA=OK\n";'
          dll="$(find /ucrt64/lib/perl5 -name Cairo.dll -print -quit)"
          test -n "$dll"
          ldd "$dll"
      - name: 5 Instalar Glib con enlazado nativo comprobado
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          cd "$WORK"
          curl -fsSL --retry 2 -o Glib-1.3294.tar.gz https://cpan.metacpan.org/authors/id/X/XA/XAOC/Glib-1.3294.tar.gz
          echo 'd715f5a86bcc187075de85e7ae5bc07b0714d6edc196a92da43986efa44e5cbb  Glib-1.3294.tar.gz' | sha256sum -c -
          tar -xzf Glib-1.3294.tar.gz
          cd Glib-1.3294
          perl Makefile.PL > "$WORK/glib-config.log" 2>&1 || { tail -70 "$WORK/glib-config.log"; exit 1; }
          ld="$(sed -n 's/^LDLOADLIBS *= *//p' Makefile | head -1)"
          fixed="$(printf '%s\n' "$ld" | perl -pe 's{\x22[^\x22]*lib(glib-2\.0|gobject-2\.0|gthread-2\.0|gio-2\.0|gmodule-2\.0|intl)\.a\x22}{-l$1}g')"
          echo "GLIB_LD_CHANGED=$([ "$ld" != "$fixed" ] && echo yes || echo no)"
          test "$ld" != "$fixed"
          mingw32-make LDLOADLIBS="$fixed" install > "$WORK/glib-build.log" 2>&1 || { tail -90 "$WORK/glib-build.log"; exit 1; }
          perl -MGlib -e 'my $l=Glib::MainLoop->new; Glib::Timeout->add(20,sub{$l->quit;0}); $l->run; print "GLIB_FUNCTIONAL=OK version=$Glib::VERSION\n"'
      - name: 6 Compilar Cairo GObject con bibliotecas de importacion
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          cd "$WORK"
          curl -fsSL --retry 2 -o Cairo-GObject-1.005.tar.gz https://cpan.metacpan.org/authors/id/X/XA/XAOC/Cairo-GObject-1.005.tar.gz
          tar -xzf Cairo-GObject-1.005.tar.gz
          cd Cairo-GObject-1.005
          perl Makefile.PL > "$WORK/cg-config.log" 2>&1 || { cat "$WORK/cg-config.log"; exit 1; }
          echo '=== Makefile LDLOADLIBS original ==='
          grep '^LDLOADLIBS *=' Makefile || true
          ld="$(sed -n 's/^LDLOADLIBS *= *//p' Makefile | head -1)"
          fixed="$(printf '%s\n' "$ld" | perl -pe 's{\x22[^\x22]*lib(cairo-gobject|cairo|glib-2\.0|gobject-2\.0|gthread-2\.0|gio-2\.0|gmodule-2\.0|intl|freetype)\.a\x22}{-l$1}g')"
          echo "CG_LD_CHANGED=$([ "$ld" != "$fixed" ] && echo yes || echo no)"
          echo "CG_LD_FIXED=$fixed"
          test "$ld" != "$fixed"
          set +e
          mingw32-make LDLOADLIBS="$fixed" > "$WORK/cg-build.log" 2>&1
          rc=$?
          echo "CG_MAKE_EXIT=$rc"
          grep -nE 'error:|undefined reference|Error [0-9]+' "$WORK/cg-build.log" | tail -70 | cut -c1-750 || true
          tail -50 "$WORK/cg-build.log" | cut -c1-850
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          mingw32-make LDLOADLIBS="$fixed" install > "$WORK/cg-install.log" 2>&1
          rc=$?
          echo "CG_INSTALL_EXIT=$rc"
          tail -35 "$WORK/cg-install.log"
          exit "$rc"
      - name: 7 Verificar carga real Cairo GObject
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          perl -MCairo -MGlib -MCairo::GObject -e 'print "CAIRO_GOBJECT_LOAD=OK version=$Cairo::GObject::VERSION\n"'
          dll="$(find /ucrt64/lib/perl5 -path '*Cairo*GObject*' -name GObject.dll -print -quit)"
          echo "CG_DLL=$dll"
          test -n "$dll"
          ldd "$dll"
          echo 'CAIRO_GOBJECT_FINAL=OK'
      - name: 8 Compilar Glib Object Introspection con import libraries
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          cd "$WORK"
          echo "GI_NATIVE_VERSION=$(pkg-config --modversion gobject-introspection-1.0)"
          perl -MCairo -MGlib -MCairo::GObject -e 'print "BASE_PERL_BINDINGS=OK\n"'
          curl -fsSL --retry 2 -o Glib-Object-Introspection-0.052.tar.gz https://cpan.metacpan.org/authors/id/X/XA/XAOC/Glib-Object-Introspection-0.052.tar.gz
          tar -xzf Glib-Object-Introspection-0.052.tar.gz
          cd Glib-Object-Introspection-0.052
          perl Makefile.PL > "$WORK/gi-config.log" 2>&1 || { tail -90 "$WORK/gi-config.log"; exit 1; }
          echo '=== GI LDLOADLIBS original ==='
          grep '^LDLOADLIBS *=' Makefile || true
          ld="$(sed -n 's/^LDLOADLIBS *= *//p' Makefile | head -1)"
          fixed="$(printf '%s\n' "$ld" | perl -pe 's{\x22[^\x22]*lib(girepository-1\.0|girepository-2\.0|glib-2\.0|gobject-2\.0|gthread-2\.0|gio-2\.0|gmodule-2\.0|intl|ffi)\.a\x22}{-l$1}g')"
          echo "GI_LD_CHANGED=$([ "$ld" != "$fixed" ] && echo yes || echo no)"
          echo "GI_LD_FIXED=$fixed"
          test "$ld" != "$fixed"
          set +e
          mingw32-make LDLOADLIBS="$fixed" > "$WORK/gi-build.log" 2>&1
          rc=$?
          echo "GI_MAKE_EXIT=$rc"
          grep -nE 'error:|undefined reference|Error [0-9]+' "$WORK/gi-build.log" | tail -90 | cut -c1-800 || true
          tail -55 "$WORK/gi-build.log" | cut -c1-900
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          mingw32-make LDLOADLIBS="$fixed" install > "$WORK/gi-install.log" 2>&1
          rc=$?
          echo "GI_INSTALL_EXIT=$rc"
          tail -35 "$WORK/gi-install.log"
          exit "$rc"
      - name: 9 Verificar introspeccion Perl real
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          perl -MGlib::Object::Introspection -e 'print "GI_PERL_LOAD=OK version=$Glib::Object::Introspection::VERSION\n"'
          perl -MGlib::Object::Introspection -e 'Glib::Object::Introspection->setup(basename=>"Gio",version=>"2.0",package=>"Gio"); print "GI_GIO_SETUP=OK\n"'
          dll="$(find /ucrt64/lib/perl5 -path '*Glib*Object*Introspection*' -name Introspection.dll -print -quit)"
          echo "GI_DLL=$dll"
          test -n "$dll"
          ldd "$dll"
          echo 'GI_FINAL=OK'
      - name: 10 Instalar bindings Gtk3 desde CPAN
        run: |
          set +e
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          echo "GTK_NATIVE_VERSION=$(pkg-config --modversion gtk+-3.0)"
          perl -MCairo -MGlib -MCairo::GObject -MGlib::Object::Introspection -e 'print "GTK_PREREQUISITES=OK\n"'
          timeout 900 perl -MCPAN -e 'CPAN::Shell->notest("install","Gtk3")' > "$WORK/gtk3-cpan.log" 2>&1
          rc=$?
          echo "GTK3_CPAN_EXIT=$rc"
          echo '::group::Diagnostico instalacion Gtk3'
          grep -nEi 'error:|undefined reference|cannot|failed|not found|Error [0-9]+' "$WORK/gtk3-cpan.log" | tail -90 | cut -c1-850 || true
          echo '::endgroup::'
          tail -90 "$WORK/gtk3-cpan.log" | cut -c1-900
          perl -MGtk3 -e 'print "GTK3_PERL_LOAD=OK version=$Gtk3::VERSION\n"'
          exit $?
      - name: 11 Verificar GTK3 sin requerir escritorio interactivo
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          perl -MGtk3 -e 'print "GTK3_LOAD=OK\n"; print "GTK3_INIT_CHECK=".(Gtk3->init_check ? "OK" : "NO_DISPLAY")."\n";'
          echo 'GTK3_MODULE_FINAL=OK'
          echo 'NOTA: init_check=NO_DISPLAY no demuestra fallo de GTK; Windows Actions puede carecer de escritorio interactivo'
      - name: 12 Crear ventana GTK3 y comprobar backend Windows
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          unset DISPLAY WAYLAND_DISPLAY
          echo '=== Dependencias de GDK GTK ==='
          objdump -p /ucrt64/bin/libgdk-3-0.dll | grep -i 'DLL Name:' | tail -35
          if objdump -p /ucrt64/bin/libgdk-3-0.dll | grep -Ei 'DLL Name:.*(cygX11|libX11|libxcb)'; then
            echo 'GDK_X11_IMPORTS=FOUND'
            exit 1
          fi
          echo 'GDK_X11_IMPORTS=NONE'
          cat > "$WORK/gtk-window-test.pl" <<'PERL'
          use strict;
          use warnings;
          use Gtk3;
          use Glib;
          Gtk3->init;
          my $window = Gtk3::Window->new('toplevel');
          $window->set_title('JavKT9 GTK3 Native Test');
          $window->set_default_size(320, 180);
          my $label = Gtk3::Label->new('Prueba GTK3 nativa');
          $window->add($label);
          $window->show_all;
          print "GTK3_WINDOW_CREATED=OK\n";
          my $gdk = $window->get_window;
          die "GTK3_GDK_WINDOW=ERROR\n" unless $gdk;
          print "GTK3_GDK_WINDOW=OK\n";
          Glib::Timeout->add(800, sub { Gtk3->main_quit; return 0; });
          Gtk3->main;
          print "GTK3_EVENT_LOOP=OK\n";
          $window->destroy;
          PERL
          timeout 30 perl "$WORK/gtk-window-test.pl"
          echo 'GTK3_WINDOW_TEST=OK'
      - name: 12b Instalar dependencia Encode Locale de GCstar
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          perl -MCPAN -e 'CPAN::Shell->notest("install","Encode::Locale")' > "$WORK/encode-locale-install.log" 2>&1
          tail -35 "$WORK/encode-locale-install.log"
          perl -MEncode::Locale -e 'print "ENCODE_LOCALE_LOAD=OK\\n"'
      - name: 12c Instalar HTML Entities para GCstar
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          perl -MCPAN -e 'CPAN::Shell->notest("install","HTML::Entities")' > "$WORK/html-entities-install.log" 2>&1
          tail -40 "$WORK/html-entities-install.log"
          perl -MHTML::Entities -e 'print "HTML_ENTITIES_LOAD=OK\\n"'
      - name: 12d Instalar LWP UserAgent para GCstar
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          perl -MCPAN -e 'CPAN::Shell->notest("install","LWP::UserAgent")' > "$WORK/lwp-install.log" 2>&1
          tail -40 "$WORK/lwp-install.log"
          perl -MLWP::UserAgent -e 'print "LWP_USERAGENT_LOAD=OK\\n"'
      - name: 12e Instalar LWP Protocol HTTPS para GCstar
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          perl -MCPAN -e 'CPAN::Shell->notest("install","LWP::Protocol::https")' > "$WORK/lwp-https-install.log" 2>&1
          tail -40 "$WORK/lwp-https-install.log"
          perl -MLWP::Protocol::https -e 'print "LWP_HTTPS_LOAD=OK\\n"'
      - name: 12f Instalar XML Simple para GCstar
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          perl -MCPAN -e 'CPAN::Shell->notest("install","XML::Simple")' > "$WORK/xml-simple-install.log" 2>&1
          tail -40 "$WORK/xml-simple-install.log"
          perl -MXML::Simple -e 'print "XML_SIMPLE_LOAD=OK\\n"'
      # Reejecutar arranque tras retirar import Gtk3::SimpleList no utilizado.
      - name: 12g Instalar Archive Zip para GCstar
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          perl -MCPAN -e 'CPAN::Shell->notest("install","Archive::Zip")' > "$WORK/archive-zip-install.log" 2>&1
          tail -40 "$WORK/archive-zip-install.log"
          perl -MArchive::Zip -e 'print "ARCHIVE_ZIP_LOAD=OK\\n"'
      - name: 12h Auditar recursos GCstar ausentes
        run: |
          set -euo pipefail
          echo '=== Rutas de recursos disponibles ==='
          for dir in src/perl/share/gcstar src/perl/lib/gcstar /ucrt64/share/gcstar /usr/share/gcstar; do
            if [ -d "$dir" ]; then
              echo "RESOURCE_DIR_PRESENT=$dir"
              find "$dir" -maxdepth 2 -type f | head -30 || true
            else
              echo "RESOURCE_DIR_MISSING=$dir"
            fi
          done
          echo '=== Iconos disponibles en checkout ==='
          find src -iname '*gcstar*png' -o -iname '*gcstar*ico' | head -30 || true
          echo '=== Referencias a recursos ==='
          grep -R -n -m 2 'gcstar_16x16.png' src/perl/bin src/perl/lib/gcstar | head -15 || true
      - name: 12i Recuperar recursos originales GCstar 1.8.1
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          mkdir -p "$WORK/gcstar-upstream"
          curl -fL --retry 3 --connect-timeout 20 -o "$WORK/gcstar-1.8.1.tar.gz" "https://gitlab.com/GCstar/GCstar/-/archive/v1.8.1/GCstar-v1.8.1.tar.gz"
          tar -xzf "$WORK/gcstar-1.8.1.tar.gz" -C "$WORK/gcstar-upstream"
          upstream="$(find "$WORK/gcstar-upstream" -type f -path '*/share/gcstar/icons/gcstar_16x16.png' -print -quit)"
          if [ -z "$upstream" ]; then
            echo 'GCSTAR_UPSTREAM_ICON=NOT_FOUND'
            find "$WORK/gcstar-upstream" -type f -name 'gcstar_16x16.png' | head -10
            exit 1
          fi
          share_dir="${upstream%/icons/gcstar_16x16.png}"
          mkdir -p src/perl/share/gcstar
          cp -R "$share_dir"/. src/perl/share/gcstar/
          test -s src/perl/share/gcstar/icons/gcstar_16x16.png
          echo 'GCSTAR_SHARE_RESOURCES=OK'
          echo "GCSTAR_SHARE_FILES=$(find src/perl/share/gcstar -type f | wc -l)"
          echo 'GCSTAR_SOURCE_CODE=UNCHANGED'
      - name: 12j Instalar compatibilidad Gtk3 SimpleList
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          perl -MCPAN -e 'CPAN::Shell->notest("install","Gtk3::SimpleList")' > "$WORK/gtk3-simplelist-install.log" 2>&1 || {
            tail -100 "$WORK/gtk3-simplelist-install.log"
            exit 1
          }
          tail -35 "$WORK/gtk3-simplelist-install.log"
          perl -MGtk3 -MGtk3::SimpleList -e 'print "GTK3_SIMPLELIST_LOAD=OK\\n"'
      # Repetir prueba con Gtk3::SimpleList cargado explicitamente en GCBasicWidgets.
      - name: 12k Verificar import SimpleList en codigo
        run: |
          set -euo pipefail
          grep -n '^use Gtk3::SimpleList;' src/perl/lib/gcstar/GCGraphicComponents/GCBasicWidgets.pm
      - name: 12l Preparar verificador Win32 de ventana GCstar
        shell: pwsh
        run: |
          @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class GcstarWindowProbe {
            public delegate bool EnumProc(IntPtr hwnd, IntPtr param);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr param);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern int GetWindowTextLength(IntPtr hwnd);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hwnd, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            public static void Main(string[] args) {
              uint target = uint.Parse(args[0]); int found = 0;
              EnumWindows((hwnd, unused) => {
                uint pid; GetWindowThreadProcessId(hwnd, out pid);
                if (pid != target || !IsWindowVisible(hwnd)) return true;
                int length = GetWindowTextLength(hwnd);
                var title = new StringBuilder(Math.Max(length + 1, 256));
                GetWindowText(hwnd, title, title.Capacity);
                Console.WriteLine("GCSTAR_WINDOW_TITLE=" + title.ToString());
                Console.WriteLine("GCSTAR_WINDOW_HANDLE=" + hwnd);
                found++;
                return true;
              }, IntPtr.Zero);
              Console.WriteLine("GCSTAR_VISIBLE_WINDOWS=" + found);
              Environment.ExitCode = found > 0 ? 0 : 2;
            }
          }
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/gcstar-window-probe.cs"
          Add-Type -Path "$env:RUNNER_TEMP/gcstar-window-probe.cs"
      - name: 12m Verificar ventana real de GCstar en Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path "$env:RUNNER_TEMP/gcstar-window-probe.cs"
          Write-Output 'GCSTAR_WIN32_PROBE_LOADED=YES'
          $bash = 'D:\a\_temp\msys64\usr\bin\bash.exe'
          if (-not (Test-Path $bash)) { $bash = 'C:\msys64\usr\bin\bash.exe' }
          if (-not (Test-Path $bash)) { throw 'No se encontro bash MSYS2 para lanzar GCstar' }
          $appdataLog = Join-Path $env:APPDATA 'JavKT9-081-RC1-Publica-Publica\gcstar.log'
          $launcher = Join-Path $env:RUNNER_TEMP 'gcstar-gui-launch.sh'
          @'
          #!/usr/bin/env bash
          set -e
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          export GCS_PROFILING=1
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          exec /ucrt64/bin/perl src/perl/bin/gcstar
          '@ | Set-Content -Path $launcher -Encoding ascii
          $launcherUnix = (& $bash -lc "cygpath -u '$($launcher.Replace('\\','/'))'").Trim()
          Write-Output "GCSTAR_GUI_LAUNCH_SCRIPT=$launcherUnix"
          $p = Start-Process -FilePath $bash -ArgumentList @($launcherUnix) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 12
            if ($p.HasExited) { if (Test-Path $appdataLog) { Get-Content $appdataLog -Tail 50 }; throw "GCSTAR_GUI_PROCESS_EXITED=$($p.ExitCode)" }
            $children = Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id -or $_.ProcessId -eq $p.Id }
            $pids = @($p.Id) + @($children | ForEach-Object ProcessId)
            $found = $false
            foreach ($pidCandidate in ($pids | Select-Object -Unique)) {
              [GcstarWindowProbe]::Main(@([string]$pidCandidate))
              if ([Environment]::ExitCode -eq 0) { $found = $true }
            }
            if (-not $found) {
              if (Test-Path $appdataLog) { Get-Content $appdataLog -Tail 50 }
              throw 'GCSTAR_GUI_WINDOW=NOT_VERIFIED'
            }
            Write-Output 'GCSTAR_GUI_WINDOW=VERIFIED_VISIBLE'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
      - name: 12n Inventariar runtime para portable experimental
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          out="$WORK/portable-inventory"
          mkdir -p "$out"
          echo '=== Perl y GTK3 ==='
          command -v perl
          perl -e 'print "PERL_VERSION=$^V\\n"'
          pkg-config --modversion gtk+-3.0
          echo '=== Bibliotecas Perl compiladas ==='
          perl -MConfig -e 'print "PERL_SITEARCH=$Config{sitearch}\\nPERL_SITELIB=$Config{sitelib}\\nPERL_ARCHLIB=$Config{archlib}\\n"'
          echo '=== DLL nativas disponibles ==='
          find /ucrt64/bin -maxdepth 1 -type f -iname '*.dll' -print | sed 's@.*/@@' | sort > "$out/ucrt64-dlls.txt"
          echo "UCRT64_DLL_COUNT=$(wc -l < "$out/ucrt64-dlls.txt")"
          echo '=== Typelibs ==='
          find /ucrt64/lib/girepository-1.0 -maxdepth 1 -type f -iname '*.typelib' -print | sed 's@.*/@@' | sort > "$out/typelibs.txt"
          echo "TYPELIB_COUNT=$(wc -l < "$out/typelibs.txt")"
          echo '=== GTK3 resources ==='
          for p in /ucrt64/share/glib-2.0/schemas /ucrt64/lib/gtk-3.0 /ucrt64/share/icons /ucrt64/share/themes; do
            if [ -d "$p" ]; then echo "RESOURCE_PRESENT=$p"; else echo "RESOURCE_MISSING=$p"; fi
          done
          echo '=== Recursos GCstar originales ==='
          echo "GCSTAR_RESOURCE_COUNT=$(find src/perl/share/gcstar -type f | wc -l)"
          echo 'PORTABLE_INVENTORY=COMPLETE_NO_PACKAGE_YET'
      - name: 12o Preparar inventario en carpeta Windows
        run: |
          set -euo pipefail
          artifact_dir="$(cygpath -u "$RUNNER_TEMP")/gcstar-runtime-inventario"
          mkdir -p "$artifact_dir"
          cp "$WORK/portable-inventory/ucrt64-dlls.txt" "$artifact_dir/"
          cp "$WORK/portable-inventory/typelibs.txt" "$artifact_dir/"
          test -s "$artifact_dir/ucrt64-dlls.txt"
          test -s "$artifact_dir/typelibs.txt"
          echo "INVENTORY_ARTIFACT_WINDOWS_PATH=$(cygpath -w "$artifact_dir")"
          ls -lh "$artifact_dir"
      - name: 12p Publicar inventario en logs sin usar cuota de artefactos
        run: |
          set -euo pipefail
          echo '=== INVENTARIO DLL UCRT64 ==='
          cat "$WORK/portable-inventory/ucrt64-dlls.txt"
          echo '=== INVENTARIO TYPELIB GTK3 ==='
          cat "$WORK/portable-inventory/typelibs.txt"
          echo "PORTABLE_INVENTORY_LOGGED=YES"
      - name: 12q Construir estructura portable experimental sin publicar
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          portable="$(cygpath -u "$RUNNER_TEMP")/javkt9-portable-experimental"
          mkdir -p "$portable"/{bin,lib,share,app}
          cp -R src/perl/bin src/perl/lib src/perl/share "$portable/app/"
          cp /ucrt64/bin/perl.exe "$portable/bin/"
          cp /ucrt64/bin/*.dll "$portable/bin/"
          cp -R /ucrt64/lib/perl5 "$portable/lib/"
          cp -R /ucrt64/lib/girepository-1.0 "$portable/lib/"
          if [ -d /ucrt64/lib/gtk-3.0 ]; then cp -R /ucrt64/lib/gtk-3.0 "$portable/lib/"; fi
          if [ -d /ucrt64/share/glib-2.0 ]; then mkdir -p "$portable/share"; cp -R /ucrt64/share/glib-2.0 "$portable/share/"; fi
          if [ -d /ucrt64/share/icons ]; then cp -R /ucrt64/share/icons "$portable/share/"; fi
          if [ -d /ucrt64/share/themes ]; then cp -R /ucrt64/share/themes "$portable/share/"; fi
          test -s "$portable/bin/perl.exe"
          test -s "$portable/app/bin/gcstar"
          test -s "$portable/app/share/gcstar/icons/gcstar_16x16.png"
          test -s "$portable/lib/girepository-1.0/Gtk-3.0.typelib"
          printf 'EXPERIMENTAL ONLY - Not validated outside MSYS2. Not for distribution.\n' > "$portable/NO_DISTRIBUIR.txt"
          echo "PORTABLE_STAGING=READY_NOT_VALIDATED"
          echo "PORTABLE_STAGING_PATH=$(cygpath -w "$portable")"
          du -sh "$portable"
          echo "PORTABLE_STAGING_FILES=$(find "$portable" -type f | wc -l)"
      - name: 12r Probar Perl empaquetado con PATH aislado
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'javkt9-portable-experimental'
          $perl = Join-Path $portable 'bin/perl.exe'
          $previousPath = $env:PATH
          try {
            $env:PATH = "$portable\bin;$env:SystemRoot\System32;$env:SystemRoot"
            $env:PERL5LIB = "$portable\app\lib;$portable\lib\perl5\site_perl;$portable\lib\perl5\vendor_perl;$portable\lib\perl5\core_perl"
            $env:GI_TYPELIB_PATH = "$portable\lib\girepository-1.0"
            $env:XDG_DATA_DIRS = "$portable\share"
            & $perl -e 'print "PORTABLE_PERL_EXEC=OK\\n"'
            if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_PERL_EXEC=FAILED' }
            & $perl -MGlib -e 'print "PORTABLE_GLIB_LOAD=OK\\n"'
            if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_GLIB_LOAD=FAILED' }
            & $perl -MGtk3 -e 'print "PORTABLE_GTK3_LOAD=OK\\n"'
            if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_GTK3_LOAD=FAILED' }
          } finally {
            $env:PATH = $previousPath
          }
      - name: 12s Arranque GCstar desde staging aislado
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'javkt9-portable-experimental'
          $perl = Join-Path $portable 'bin/perl.exe'
          $entry = Join-Path $portable 'app/bin/gcstar'
          $env:PATH = "$portable\bin;$env:SystemRoot\System32;$env:SystemRoot"
          $env:PERL5LIB = "$portable\app\lib;$portable\lib\perl5\site_perl;$portable\lib\perl5\vendor_perl;$portable\lib\perl5\core_perl"
          $env:GI_TYPELIB_PATH = "$portable\lib\girepository-1.0"
          $env:XDG_DATA_DIRS = "$portable\share"
          $env:GCS_PROFILING = '1'
          $p = Start-Process -FilePath $perl -ArgumentList @($entry) -WorkingDirectory (Join-Path $portable 'app') -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 15
            if ($p.HasExited) { throw "PORTABLE_GCSTAR_PROCESS=EXIT_$($p.ExitCode)" }
            Write-Output 'PORTABLE_GCSTAR_PROCESS=ALIVE_15S'
            Add-Type -Path "$env:RUNNER_TEMP/gcstar-window-probe.cs"
            Write-Output 'PORTABLE_WIN32_PROBE_LOADED=YES'
            $visible = 0
            $callback = [GcstarWindowProbe+EnumProc]{
              param([IntPtr]$hwnd, [IntPtr]$unused)
              [uint32]$windowPid = 0
              [void][GcstarWindowProbe]::GetWindowThreadProcessId($hwnd, [ref]$windowPid)
              if ($windowPid -eq [uint32]$p.Id -and [GcstarWindowProbe]::IsWindowVisible($hwnd)) {
                $script:portableWindowCount++
                $title = New-Object System.Text.StringBuilder 512
                [void][GcstarWindowProbe]::GetWindowText($hwnd, $title, $title.Capacity)
                Write-Output "PORTABLE_GCSTAR_WINDOW_TITLE=$($title.ToString())"
              }
              return $true
            }
            $script:portableWindowCount = 0
            [void][GcstarWindowProbe]::EnumWindows($callback, [IntPtr]::Zero)
            Write-Output "PORTABLE_GCSTAR_VISIBLE_WINDOWS=$script:portableWindowCount"
            if ($script:portableWindowCount -gt 0) {
              Write-Output 'PORTABLE_GCSTAR_GUI=VERIFIED_VISIBLE'
            } else {
              Write-Output 'PORTABLE_GCSTAR_GUI=NOT_VERIFIED'
              throw 'Portable process alive but no visible window for its PID'
            }
            # Detectar DLL cargadas fuera del paquete. No equivale a probar Windows limpio,
            # pero evita falsos positivos cuando PATH esta aislado y MSYS2 sigue instalado.
            $loaded = @(Get-Process -Id $p.Id -Module -ErrorAction Stop | ForEach-Object { $_.FileName })
            $portableRoot = [IO.Path]::GetFullPath($portable).TrimEnd('\') + '\'
            $windowsRoot = [IO.Path]::GetFullPath($env:SystemRoot).TrimEnd('\') + '\'
            $foreign = @($loaded | Where-Object {
              $_ -and -not $_.StartsWith($portableRoot, [StringComparison]::OrdinalIgnoreCase) -and
              -not $_.StartsWith($windowsRoot, [StringComparison]::OrdinalIgnoreCase)
            })
            Write-Output "PORTABLE_LOADED_MODULE_COUNT=$($loaded.Count)"
            foreach ($module in $foreign) { Write-Output "PORTABLE_FOREIGN_MODULE=$module" }
            if ($foreign.Count -gt 0) { throw 'PORTABLE_DEPENDENCY_ISOLATION=FAILED_FOREIGN_MODULES' }
            Write-Output 'PORTABLE_DEPENDENCY_ISOLATION=PASS_LOADED_MODULES'
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: 12t Auditar referencias MSYS2 y rutas absolutas en staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:RUNNER_TEMP 'javkt9-portable-experimental'
          $perl = Join-Path $portable 'bin/perl.exe'
          $env:PATH = "$portable\\bin;$env:SystemRoot\\System32;$env:SystemRoot"
          $env:PERL5LIB = "$portable\\app\\lib;$portable\\lib\\perl5\\site_perl;$portable\\lib\\perl5\\vendor_perl;$portable\\lib\\perl5\\core_perl"
          $env:GI_TYPELIB_PATH = "$portable\\lib\\girepository-1.0"
          $env:XDG_DATA_DIRS = "$portable\\share"
          $code = @'
          use strict;
          use warnings;
          use Config;
          use Glib;
          use Gtk3;
          print "PORTABLE_PERL_EXECUTABLE=$^X\\n";
          print "PORTABLE_PERL_ARCHLIB=$Config{archlib}\\n";
          print "PORTABLE_PERL_PRIVLIB=$Config{privlib}\\n";
          print "PORTABLE_PERL_SITEARCH=$Config{sitearch}\\n";
          print "PORTABLE_PERL_SITELIB=$Config{sitelib}\\n";
          print "PORTABLE_INC=$_\\n" for @INC;
          '@
          $probe = Join-Path $env:RUNNER_TEMP 'portable-path-probe.pl'
          Set-Content -Path $probe -Value $code -Encoding ascii
          $lines = @(& $perl $probe 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "PORTABLE_PATH_PROBE_FAILED=$LASTEXITCODE" }
          $lines | ForEach-Object { Write-Output $_ }
          $bad = @($lines | Where-Object { $_ -match '^PORTABLE_(?:PERL_(?:ARCHLIB|PRIVLIB|SITEARCH|SITELIB)|INC)=' -and $_ -match '(?i)(?:[A-Z]:[\\/](?:msys64|a[\\/]_temp[\\/]msys64)|/ucrt64/|/usr/)' })
          foreach ($line in $bad) { Write-Output "PORTABLE_EXTERNAL_PERL_PATH=$line" }
          if ($bad.Count -gt 0) { throw 'PORTABLE_PERL_PATH_ISOLATION=FAILED' }
          Write-Output 'PORTABLE_PERL_PATH_ISOLATION=PASS'
      - name: 12u Compilar instalador Inno experimental sin publicar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:RUNNER_TEMP 'javkt9-portable-experimental'
          $installerDir = Join-Path $env:GITHUB_WORKSPACE 'installer-experimental-gcstar'
          $payload = Join-Path $installerDir 'Payload'
          if (Test-Path $payload) { Remove-Item $payload -Recurse -Force }
          New-Item -ItemType Directory -Path $payload | Out-Null
          Copy-Item -Path (Join-Path $portable '*') -Destination $payload -Recurse -Force
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'INNO_SETUP_COMPILER_NOT_FOUND' }
          & $iscc (Join-Path $installerDir 'JavKT9-GCstar-Portable.iss')
          if ($LASTEXITCODE -ne 0) { throw "INNO_SETUP_COMPILE_FAILED=$LASTEXITCODE" }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'output-gcstar-experimental/JavKT9-GCstar-Experimental-NO-DISTRIBUIR.exe'
          if (-not (Test-Path $exe)) { throw 'INNO_SETUP_OUTPUT_MISSING' }
          Write-Output "INNO_EXPERIMENTAL_COMPILE=PASS"
          Write-Output "INNO_EXPERIMENTAL_BYTES=$((Get-Item $exe).Length)"
          Write-Output 'INNO_EXPERIMENTAL_RELEASE=NOT_PUBLISHED'
      - name: 12v Instalar ejecutar y desinstalar setup experimental
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'output-gcstar-experimental/JavKT9-GCstar-Experimental-NO-DISTRIBUIR.exe'
          $target = Join-Path $env:RUNNER_TEMP 'javkt9-installed-smoke'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $install = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "INSTALLER_SILENT_INSTALL_FAILED=$($install.ExitCode)" }
          $perl = Join-Path $target 'bin/perl.exe'
          $gcstar = Join-Path $target 'app/bin/gcstar'
          $uninstaller = Join-Path $target 'unins000.exe'
          foreach ($required in @($perl,$gcstar,$uninstaller)) { if (-not (Test-Path $required)) { throw "INSTALLER_MISSING_FILE=$required" } }
          Write-Output 'INSTALLER_SILENT_INSTALL=PASS'
          $env:PATH = "$target\\bin;$env:SystemRoot\\System32;$env:SystemRoot"
          $env:PERL5LIB = "$target\\app\\lib;$target\\lib\\perl5\\site_perl;$target\\lib\\perl5\\vendor_perl;$target\\lib\\perl5\\core_perl"
          $env:GI_TYPELIB_PATH = "$target\\lib\\girepository-1.0"
          $env:XDG_DATA_DIRS = "$target\\share"
          & $perl -MGlib -MGtk3 -e 'print "INSTALLED_GTK3_LOAD=PASS\\n"'
          if ($LASTEXITCODE -ne 0) { throw 'INSTALLED_GTK3_LOAD=FAIL' }
          $process = Start-Process -FilePath $perl -ArgumentList ('"{0}"' -f $gcstar) -WorkingDirectory (Join-Path $target 'app') -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 12
            $process.Refresh()
            if ($process.HasExited) { throw "INSTALLED_GCSTAR_EARLY_EXIT=$($process.ExitCode)" }
            Write-Output 'INSTALLED_GCSTAR_PROCESS=ALIVE_12S'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "INSTALLER_SILENT_UNINSTALL_FAILED=$($uninstall.ExitCode)" }
          if (Test-Path $perl) { throw 'INSTALLER_UNINSTALL_LEFT_PERL_EXECUTABLE' }
          Write-Output 'INSTALLER_SILENT_UNINSTALL=PASS'
          Write-Output 'INSTALLER_FULL_LIFECYCLE=PASS'
      - name: 12w Guardar instalador experimental descargable
        if: github.event_name == 'workflow_dispatch' && inputs.subir_instalador == true
        uses: actions/upload-artifact@v4
        with:
          name: JavKT9-GCstar-Experimental-NO-DISTRIBUIR
          path: output-gcstar-experimental/JavKT9-GCstar-Experimental-NO-DISTRIBUIR.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: 13 Diagnosticar arranque GCstar completo
        run: |
          set +e
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          export HOME="$WORK/gcstar-home"
          mkdir -p "$HOME"
          echo '=== Version GCstar y rutas ==='
          perl src/perl/bin/gcstar --version > "$WORK/gcstar-version.log" 2>&1
          ver_rc=$?
          echo "GCSTAR_VERSION_EXIT=$ver_rc"
          tail -35 "$WORK/gcstar-version.log"
          echo '=== Prueba de inicio completo (limite 25 s) ==='
          export GCS_PROFILING=1
          timeout 25 perl src/perl/bin/gcstar > "$WORK/gcstar-start.log" 2>&1
          start_rc=$?
          echo "GCSTAR_START_EXIT=$start_rc"
          echo '=== Log real redirigido por GCstar en APPDATA ==='
          appdata_unix="$(cygpath -u "$APPDATA")"
          gcstar_log="$appdata_unix/JavKT9-081-RC1-Publica-Publica/gcstar.log"
          echo "GCSTAR_LOG_PRESENT=$([ -f "$gcstar_log" ] && echo YES || echo NO)"
          if [ -f "$gcstar_log" ]; then
            echo '::group::GCstar APPDATA gcstar.log'
            tail -150 "$gcstar_log" | cut -c1-1000
            echo '::endgroup::'
            grep -nEi "Can't locate|Can't load|error|failed|undefined|uninitialized|could not|fatal|exception" "$gcstar_log" | tail -60 | cut -c1-900 || true
          fi
          echo '::group::Log de arranque'
          tail -120 "$WORK/gcstar-start.log" | cut -c1-1000
          echo '::endgroup::'
          echo '=== Modulos faltantes ==='
          grep -nEi "Can't locate|Can't load|error|failed|undefined|uninitialized|could not" "$WORK/gcstar-start.log" | tail -70 | cut -c1-900 || true
          if [ "$ver_rc" -ne 0 ]; then echo 'GCSTAR_VERSION=ERROR'; exit 1; fi
          if [ "$start_rc" -eq 124 ]; then
            echo 'GCSTAR_PROCESS_SURVIVED_25S=YES'
            echo 'GCSTAR_SMOKE=PASS_PROCESS_ONLY'
          elif [ "$start_rc" -eq 0 ]; then
            echo 'GCSTAR_PROCESS_EXITED_NORMALLY=YES'
            echo 'GCSTAR_SMOKE=NEEDS_GUI_REVIEW'
          else
            echo 'GCSTAR_SMOKE=ERROR'
            exit 1
          fi
