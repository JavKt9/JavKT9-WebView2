name: Inspeccionar MakeMaker Glib MSYS2 experimental
on:
  push:
    branches: [experimento-gcstar-par-rc1]
    paths: ['.github/workflows/inspeccionar-makemaker-glib-msys2-experimental.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glib:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-make
            curl
            tar
      - name: Entorno y prerrequisitos
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH" PERL_MM_USE_DEFAULT=1
          mkdir -p /tmp/glib-work
          perl -V:version -V:archname -V:make -V:cc -V:ld -V:lddlflags -V:libpth -V:lib_ext
          pkg-config --modversion glib-2.0
          pkg-config --libs glib-2.0 gobject-2.0 gmodule-2.0 gio-2.0
          perl -MCPAN -e 'CPAN::Shell->notest("install","ExtUtils::Depends","ExtUtils::PkgConfig")' > /tmp/glib-work/prereq.log 2>&1 || true
          perl -MExtUtils::Depends -MExtUtils::PkgConfig -e 'print "PREREQ_OK\n"' || { tail -40 /tmp/glib-work/prereq.log; exit 1; }
      - name: Descargar Glib 1.3294
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          cd /tmp/glib-work
          curl -fSL --retry 2 -o Glib-1.3294.tar.gz https://cpan.metacpan.org/authors/id/X/XA/XAOC/Glib-1.3294.tar.gz || { echo DESCARGA_ERROR; exit 1; }
          sha256sum Glib-1.3294.tar.gz
          tar -xzf Glib-1.3294.tar.gz
          test -f Glib-1.3294/Makefile.PL
      - name: Diagnosticar Liblist y Makefile
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          cd /tmp/glib-work
          cat > liblist.pl <<'PERL'
          use ExtUtils::Liblist;
          my $in = shift;
          my @r = ExtUtils::Liblist->ext($in, 2);
          print "ENTRADA=[$in]\nEXTRALIBS=[$r[0]]\nBSLOADLIBS=[$r[1]]\nLDLOADLIBS=[$r[2]]\n";
          PERL
          libs="$(pkg-config --libs glib-2.0 gobject-2.0 gmodule-2.0 gio-2.0)"
          perl liblist.pl "-L/ucrt64/lib $libs" 2>&1 | tee liblist.log
          cd Glib-1.3294
          perl Makefile.PL > ../makefile-pl.log 2>&1 || { cat ../makefile-pl.log; exit 1; }
          cat ../makefile-pl.log
          grep -nE '^(LD|LDDLFLAGS|LDFROM|EXTRALIBS|LDLOADLIBS|BSLOADLIBS|LIBS|INC|DEFINE) *=' Makefile | tee ../makefile-vars.log || true
          sed -n '595,602p' Makefile
      - name: 5 Compilar y mostrar errores reales
        run: |
          set +e
          set -u
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          cd /tmp/glib-work/Glib-1.3294 || exit 1
          mingw32-make > ../make-full.log 2>&1
          rc=$?
          echo "$rc" > ../make.rc
          echo "MAKE_EXIT=$rc"
          echo '::group::Errores y resumen'
          grep -nE 'error:|fatal error|undefined reference|Error [0-9]+' ../make-full.log | head -55 | cut -c1-500 || true
          echo "UNDEFINED_TOTAL=$(grep -c 'undefined reference' ../make-full.log || true)"
          echo "UNDEFINED_IMP=$(grep 'undefined reference' ../make-full.log | grep -c '__imp_' || true)"
          echo '::endgroup::'
          echo '::group::Comandos completos de enlace'
          grep -E 'g\+\+.*(-shared|Glib.dll)|Glib.dll.*(-shared|g\+\+)' ../make-full.log | tail -8 | cut -c1-12000 || true
          echo '::endgroup::'
          echo '::group::Ultimas 45 lineas'
          tail -45 ../make-full.log | cut -c1-800
          echo '::endgroup::'
          exit 0
      - name: 6 Comparar bibliotecas estaticas y de importacion
        run: |
          set +e
          set -u
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          cd /tmp/glib-work/Glib-1.3294 || exit 1
          echo '::group::Archivos de GLib'
          ls -l /ucrt64/lib/libglib-2.0.* /ucrt64/lib/libgobject-2.0.* 2>&1
          for f in /ucrt64/lib/libglib-2.0.a /ucrt64/lib/libglib-2.0.dll.a; do
            if [ -f "$f" ]; then
              echo "$f __imp_g_free=$(nm -A "$f" 2>/dev/null | grep -c '__imp_g_free' || true)"
            else
              echo "$f NO_EXISTE"
            fi
          done
          echo '::endgroup::'
          echo '::group::LDLOADLIBS original'
          grep '^LDLOADLIBS *=' Makefile || true
          echo '::endgroup::'
          echo '::group::Trace de bibliotecas usadas por el enlazador'
          mingw32-make OTHERLDFLAGS='-Wl,-t' > ../make-trace.log 2>&1
          echo "TRACE_EXIT=$?"
          grep -iE 'lib(glib|gobject|gthread|gio|gmodule)-2\.0|libintl' ../make-trace.log | grep -v 'undefined reference' | head -35 | cut -c1-600 || true
          echo '::endgroup::'
          exit 0
      - name: 7 Correccion condicional de bibliotecas de importacion
        run: |
          set +e
          set -u
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          cd /tmp/glib-work/Glib-1.3294 || exit 1
          if [ "$(cat ../make.rc)" = 0 ]; then
            echo 'Compilacion inicial correcta'
            mingw32-make install > ../install.log 2>&1
            echo "INSTALL_EXIT=$?"
            tail -12 ../install.log
            exit 0
          fi
          ld="$(sed -n 's/^LDLOADLIBS *= *//p' Makefile | head -1)"
          if ! printf '%s' "$ld" | grep -Eq 'lib(glib|gobject|gthread|gio|gmodule)-2\.0\.a|libintl\.a'; then
            echo 'CAUSA_NO_CONFIRMADA: sin rutas .a de GLib'
            exit 0
          fi
          echo 'HIPOTESIS_IMPORT_LIB: Makefile fija bibliotecas .a; probando -l en vez de ruta completa'
          fixed="$(printf '%s\n' "$ld" | perl -pe 's{"[^"]*[/\\]lib(glib-2\.0|gobject-2\.0|gthread-2\.0|gio-2\.0|gmodule-2\.0|intl)\.a"}{-l$1}g')"
          echo "LDLOADLIBS_OVERRIDE=$fixed"
          mingw32-make LDLOADLIBS="$fixed" install > ../fix-make.log 2>&1
          frc=$?
          echo "FIX_MAKE_EXIT=$frc"
          grep -nE 'error:|undefined reference|Error [0-9]+' ../fix-make.log | head -35 | cut -c1-500 || true
          tail -25 ../fix-make.log | cut -c1-600
          exit 0
      - name: 8 Verificar carga y funcionamiento real
        run: |
          set +e
          set -u
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          perl -MGlib -e 'print "GLIB_OK ", join(".", Glib->GET_VERSION_INFO), " (bindings $Glib::VERSION)\n"'
          rc=$?
          if [ "$rc" -ne 0 ]; then echo GLIB_PERL_LOAD=ERROR; exit 1; fi
          echo GLIB_PERL_LOAD=OK
          perl -MGlib -e 'my $l=Glib::MainLoop->new; Glib::Timeout->add(50,sub{$l->quit;0}); $l->run; print "GLIB_MAINLOOP_OK\n"'
          rc=$?
          if [ "$rc" -ne 0 ]; then echo GLIB_FUNCTIONAL=ERROR; exit 1; fi
          echo GLIB_FUNCTIONAL=OK
          dll="$(find /ucrt64/lib/perl5 -name Glib.dll -print -quit)"
          echo "DLL=$dll"
          if [ -n "$dll" ]; then ldd "$dll"; fi
