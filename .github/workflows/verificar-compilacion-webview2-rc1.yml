name: Verificar compilacion WebView2 RC1 (sin instalador)

on:
  workflow_dispatch:
  push:
    branches:
      - fuentes-rc1-auditoria
    paths:
      - .github/workflows/verificar-compilacion-webview2-rc1.yml

permissions:
  contents: write

jobs:
  compilar-host:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Descargar fuentes de la rama de auditoria
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias del host WebView2
        shell: pwsh
        run: dotnet restore "src/JavKT9WebView2/JavKT9WebView2.csproj" -r win-x64

      - name: Compilar host Windows sin instalar ni ejecutar
        shell: pwsh
        run: |
          dotnet publish "src/JavKT9WebView2/JavKT9WebView2.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output "$env:RUNNER_TEMP/JavKT9WebView2-verificacion"
          if ($LASTEXITCODE -ne 0) { throw "Fallo la compilacion WebView2" }
          $exe = Join-Path $env:RUNNER_TEMP "JavKT9WebView2-verificacion/JavKT9WebView2.exe"
          if (!(Test-Path -LiteralPath $exe)) { throw "No se genero el EXE del host" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Write-Output "Compilacion correcta. SHA-256 del host construido: $hash"
          Write-Output "No se ha probado la captura de peliculas ni se ha construido un instalador."

      - name: Registrar compilacion exitosa en rama de auditoria
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "JavKT9WebView2-verificacion/JavKT9WebView2.exe"
          if (!(Test-Path -LiteralPath $exe)) { throw "El EXE no existe" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          $report = @'
          # Verificacion de compilacion WebView2 RC1

          **RESULTADO: COMPILACION CORRECTA EN WINDOWS** (GitHub Actions).

          Se ejecuto `dotnet restore` y `dotnet publish` para `src/JavKT9WebView2/JavKT9WebView2.csproj`, con .NET SDK 8, `win-x64` y `--self-contained true`.

          Se genero `JavKT9WebView2.exe` en una carpeta temporal del runner. No se publico, instalo ni ejecuto el host.

          **No se ha comprobado equivalencia con el EXE RC1 ni funcionamiento de WebView2 con JavLibrary.** Tampoco se han compilado `JavKT9.exe`, `GCJavBridgeLauncher.exe` ni el instalador.
          '@
          $report += "`n- SHA-256 del EXE generado: `$hash`.`n"
          Set-Content -LiteralPath "docs/VERIFICACION_COMPILACION_WEBVIEW2_RC1.md" -Value $report -Encoding utf8
          git add -- docs/VERIFICACION_COMPILACION_WEBVIEW2_RC1.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: registrar compilacion de host WebView2 en Windows"
          git pull --rebase origin fuentes-rc1-auditoria
          if ($LASTEXITCODE -ne 0) { throw "No se pudo rebasar el reporte" }
          git push origin HEAD:fuentes-rc1-auditoria
          if ($LASTEXITCODE -ne 0) { throw "No se pudo subir el reporte" }
